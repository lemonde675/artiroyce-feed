<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Actualités ArtiRoyce</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --red:#e63224; --green:#27a945; }
html, body { height: 100%; width: 100%; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f2f2f2; }

.top-header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #eee; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
.top-header .logo { font-weight: 800; font-size: 19px; }
.top-header .logo .arti { color: var(--red); }
.top-header .logo .royce { color: var(--green); }

.zone-publier { background: #fff; padding: 12px 14px; border-bottom: 8px solid #eee; }
.zone-publier textarea { width: 100%; min-height: 60px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; resize: vertical; }
.zone-publier .ligne-bouton { display: flex; justify-content: flex-end; margin-top: 8px; }
.zone-publier button { background: var(--red); color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; font-weight: 700; }
.zone-publier button:disabled { opacity: 0.6; }

#feedZone { padding: 10px; }
#feedLoading, #feedEmpty { text-align: center; padding: 60px 20px; color: #999; }
#feedLoading .sablier, #feedEmpty .icone { font-size: 40px; display: block; margin-bottom: 10px; }
#feedEmpty { display: none; }

.post { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.post .auteur { font-weight: 700; font-size: 14.5px; }
.post .meta { font-size: 12px; color: #999; margin-top: 1px; }
.post .texte { margin-top: 8px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }

#panneauDiagnostic { position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; background: #1a1a1a; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px 10px; max-height: 160px; overflow-y: auto; line-height: 1.5; border-top: 3px solid #0f0; }
</style>
</head>
<body>

<header class="top-header">
  <div class="logo"><span class="arti">Arti</span><span class="royce">Royce</span> — Actualités</div>
</header>

<div class="zone-publier">
  <textarea id="texteAPublier" placeholder="Quoi de neuf ?"></textarea>
  <div class="ligne-bouton">
    <button id="btnPublier" onclick="publier()">Publier</button>
  </div>
</div>

<div id="feedZone">
  <div id="feedLoading"><span class="sablier">⏳</span>Chargement des publications…</div>
  <div id="feedEmpty"><span class="icone">📭</span>Aucune publication pour l'instant.</div>
  <div id="feedPosts"></div>
</div>

<div id="panneauDiagnostic"></div>

<script type="module">
/* ══════════════════════════════════════════════════════════════════
   RECONSTRUCTION MINIMALE — 31/07/2026.
   Objectif : repartir d'une base la plus simple possible qui affiche
   correctement le fil, avant de rajouter (un par un, en testant à
   chaque fois) : réactions, commentaires, partage, catégories,
   galerie/boutique, carrousel, classement par priorité, etc.
   ══════════════════════════════════════════════════════════════════ */

// Petit journal visible directement à l'écran (toujours affiché, pas besoin
// de ?debug=1), pour voir où le chargement progresse ou s'arrête.
function ajouterEtape(texte){
  const panneau = document.getElementById('panneauDiagnostic');
  if (!panneau) return;
  const ligne = document.createElement('div');
  ligne.textContent = new Date().toLocaleTimeString() + ' — ' + texte;
  panneau.appendChild(ligne);
}
ajouterEtape('1. Script module démarré ✅');

// Attrape-erreur global : affiche directement sur la page n'importe quelle
// erreur JavaScript, pour voir le vrai problème sans avoir besoin de la console.
function afficherErreurVisible(msg){
  const target = document.getElementById('feedPosts') || document.body;
  const bloc = document.createElement('div');
  bloc.style.cssText = 'text-align:left;padding:14px 16px;margin:0 0 10px;font-size:12px;color:#e63224;background:#fff3f0;border:1px solid #f5c6bb;border-radius:12px;word-break:break-word;white-space:pre-wrap;font-family:monospace;';
  bloc.textContent = '⚠️ ' + msg;
  target.prepend(bloc);
}
window.addEventListener('error', e => afficherErreurVisible('Erreur JS : ' + e.message + ' (' + (e.filename ? e.filename.split('/').pop() : '?') + ':' + (e.lineno || '?') + ')'));
window.addEventListener('unhandledrejection', e => afficherErreurVisible('Erreur async non gérée : ' + ((e.reason && e.reason.message) ? e.reason.message : String(e.reason))));

function avecDelaiMax(promesse, millisecondes){
  return Promise.race([
    promesse,
    new Promise((_, reject) => setTimeout(() => reject(new Error('Délai dépassé (' + (millisecondes/1000) + 's)')), millisecondes))
  ]);
}

let initializeApp, getAuth, onAuthStateChanged, getFirestore, initializeFirestore, collection,
    addDoc, getDoc, doc, onSnapshot, orderBy, query, serverTimestamp;
let app, auth, db, currentUser = null;

(async function demarrerFirebase(){
  try {
    ajouterEtape('2. Téléchargement de la bibliothèque Firebase (app)...');
    const modApp = await avecDelaiMax(import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'), 12000);
    initializeApp = modApp.initializeApp;
    ajouterEtape('2b. Bibliothèque app chargée ✅');

    ajouterEtape('2c. Téléchargement de la bibliothèque Firebase (auth)...');
    const modAuth = await avecDelaiMax(import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'), 12000);
    getAuth = modAuth.getAuth; onAuthStateChanged = modAuth.onAuthStateChanged;
    ajouterEtape('2d. Bibliothèque auth chargée ✅');

    ajouterEtape('2e. Téléchargement de la bibliothèque Firebase (firestore)...');
    const modFs = await avecDelaiMax(import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'), 12000);
    getFirestore = modFs.getFirestore; initializeFirestore = modFs.initializeFirestore;
    collection = modFs.collection; addDoc = modFs.addDoc; getDoc = modFs.getDoc; doc = modFs.doc;
    onSnapshot = modFs.onSnapshot; orderBy = modFs.orderBy; query = modFs.query; serverTimestamp = modFs.serverTimestamp;
    ajouterEtape('3. Toutes les bibliothèques Firebase chargées ✅');
  } catch (err) {
    ajouterEtape('❌ ÉCHEC du téléchargement Firebase : ' + (err && err.message ? err.message : String(err)));
    document.getElementById('feedLoading').innerHTML =
      '<div style="font-size:13px;color:#e63224;padding:0 20px">❌ Impossible de charger Firebase (fichiers depuis gstatic.com).<br>'
      + '<span style="font-family:monospace;font-size:11px">' + (err && err.message ? err.message.replace(/</g,'&lt;') : 'Erreur inconnue') + '</span></div>';
    return;
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBS_6CJN7Fu50pMu98sjuRxQetUcLu9l9w",
    authDomain: "artiroyce-f42e4.firebaseapp.com",
    projectId: "artiroyce-f42e4",
    storageBucket: "artiroyce-f42e4.firebasestorage.app",
    messagingSenderId: "588140774605",
    appId: "1:588140774605:web:b69cf8740c2fe5f1d59584"
  };
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { experimentalForceLongPolling: true });
  ajouterEtape('4. Firebase initialisé ✅, démarrage de l\u2019écoute de connexion...');
  onAuthStateChanged(auth, surChangementAuth);
})();

async function surChangementAuth(user) {
  ajouterEtape('4b. onAuthStateChanged déclenché, user = ' + (user ? user.uid : 'AUCUN'));
  if (!user) { window.location.href = 'connexion.html'; return; }
  currentUser = user;
  currentUser.displayName = user.email ? user.email.split('@')[0] : 'Moi';

  try {
    ajouterEtape('5. Lecture du profil utilisateur...');
    const snap = await avecDelaiMax(getDoc(doc(db, 'utilisateurs', user.uid)), 8000);
    if (snap.exists()) {
      const d = snap.data();
      currentUser.displayName = d.nom || d.prenom || currentUser.displayName;
    }
    ajouterEtape('6. Profil utilisateur lu ✅');
  } catch (e) {
    ajouterEtape('6bis. Échec lecture profil (' + (e && e.message || e) + '), on continue quand même');
  }

  ajouterEtape('7. Appel de chargerPublications()...');
  chargerPublications();
}

function formatDate(dateFirestore){
  try {
    const d = dateFirestore && dateFirestore.toDate ? dateFirestore.toDate() : new Date();
    return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  } catch(e) { return ''; }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function chargerPublications() {
  try {
    const q = query(collection(db, 'publications'), orderBy('createdAt', 'desc'));
    onSnapshot(q, snap => {
      const toutes = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.corbeille);
      afficherFeed(toutes);
      ajouterEtape('8. Publications chargées ✅ (' + toutes.length + ')');
    }, err => {
      ajouterEtape('❌ Erreur lecture publications : ' + (err && err.message || err));
      document.getElementById('feedLoading').style.display = 'none';
      document.getElementById('feedEmpty').style.display = 'block';
    });
  } catch (e) {
    ajouterEtape('❌ Exception chargerPublications : ' + (e && e.message || e));
  }
}

function afficherFeed(liste) {
  document.getElementById('feedLoading').style.display = 'none';
  const conteneur = document.getElementById('feedPosts');
  const vide = document.getElementById('feedEmpty');
  if (!liste.length) { vide.style.display = 'block'; conteneur.innerHTML = ''; return; }
  vide.style.display = 'none';
  conteneur.innerHTML = liste.map(p => (
    '<div class="post">'
    + '<div class="auteur">' + escapeHtml(p.auteurNom || 'Anonyme') + '</div>'
    + '<div class="meta">' + formatDate(p.createdAt) + '</div>'
    + '<div class="texte">' + escapeHtml(p.texte || '') + '</div>'
    + '</div>'
  )).join('');
}

window.publier = async function() {
  const champ = document.getElementById('texteAPublier');
  const texte = champ.value.trim();
  if (!texte) return;
  if (!currentUser) { ajouterEtape('❌ Publication refusée : utilisateur non connecté'); return; }
  const btn = document.getElementById('btnPublier');
  btn.disabled = true; btn.textContent = 'Publication…';
  try {
    await addDoc(collection(db, 'publications'), {
      type: 'texte',
      texte: texte,
      auteurNom: currentUser.displayName,
      auteurUid: currentUser.uid,
      createdAt: serverTimestamp(),
      likes: 0,
      partages: 0
    });
    champ.value = '';
  } catch (e) {
    ajouterEtape('❌ Erreur publication : ' + (e && e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = 'Publier';
  }
};
</script>
</body>
</html>
