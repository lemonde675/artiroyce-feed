<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Test léger ArtiRoyce</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#f0f1f3;padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:16px;margin-bottom:14px;color:#111}
  .statut{padding:14px;border-radius:12px;font-size:13px;margin-bottom:14px;font-family:monospace;white-space:pre-wrap;word-break:break-word}
  .statut.attente{background:#eef3ff;color:#1a3a7a;border:2px solid #4a7fe0}
  .statut.ok{background:#e8f9ec;color:#155724;border:2px solid #27a945}
  .statut.fail{background:#fff3f0;color:#7a1a10;border:2px solid #e63224}
  .post{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13px}
  .post b{display:block;font-size:13px;margin-bottom:3px}
  button{width:100%;padding:12px;border:none;border-radius:10px;background:#e63224;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px}
  button:disabled{background:#ccc}
</style>
</head>
<body>
  <h1>🧪 Test léger — Actualités (4 par 4)</h1>
  <div class="statut attente" id="statut">⏳ Connexion en cours…</div>
  <div id="liste"></div>
  <button id="btnPlus" style="display:none" onclick="chargerSuite()">Charger 4 de plus</button>

  <div style="margin-top:24px;border-top:1px solid #ddd;padding-top:16px">
    <h1>🌐 Test brut (sans bibliothèque Firebase)</h1>
    <div class="statut attente" id="statutBrut">En attente…</div>
    <button onclick="testBrut()">Lancer le test réseau brut</button>
  </div>

  <div style="margin-top:24px;border-top:1px solid #ddd;padding-top:16px">
    <h1>🔑 Test du jeton d'authentification</h1>
    <div class="statut attente" id="statutToken">En attente…</div>
    <button onclick="testToken()">Récupérer mon jeton</button>
  </div>

  <div style="margin-top:24px;border-top:1px solid #ddd;padding-top:16px">
    <h1>🚀 Lecture REST directe (contourne le SDK)</h1>
    <div class="statut attente" id="statutRest">En attente…</div>
    <div id="listeRest"></div>
    <button onclick="testLectureRest()">Lire 4 publications via REST</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, startAfter, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBS_6CJN7Fu50pMu98sjuRxQetUcLu9l9w",
  authDomain: "artiroyce-f42e4.firebaseapp.com",
  projectId: "artiroyce-f42e4",
  storageBucket: "artiroyce-f42e4.firebasestorage.app",
  messagingSenderId: "588140774605",
  appId: "1:588140774605:web:b69cf8740c2fe5f1d59584"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const TAILLE = 4;
let curseur = null;
let fin = false;

function statut(classe, texte){
  const el = document.getElementById('statut');
  el.className = 'statut ' + classe;
  el.textContent = texte;
}

function afficherPost(p){
  const div = document.createElement('div');
  div.className = 'post';
  div.innerHTML = '<b>' + (p.auteurNom || 'Anonyme') + '</b>' + (p.texte ? p.texte.substring(0,120) : '(sans texte)');
  document.getElementById('liste').appendChild(div);
}

async function avecDelaiMax(promesse, ms){
  return Promise.race([
    promesse,
    new Promise((_, rej) => setTimeout(() => rej(new Error('Délai dépassé après ' + (ms/1000) + 's — Firestore ne répond pas.')), ms))
  ]);
}

async function chargerPremiere(){
  const debut = Date.now();
  let secs = 0;
  const iv = setInterval(() => {
    secs = Math.floor((Date.now()-debut)/1000);
    statut('attente', '⏳ Lecture Firestore en cours… ' + secs + 's écoulées');
  }, 1000);
  try {
    const q = query(collection(db,'publications'), orderBy('createdAt','desc'), limit(TAILLE));
    const snap = await avecDelaiMax(getDocs(q), 30000);
    clearInterval(iv);
    const ms = Date.now() - debut;
    statut('ok', '✅ Succès en ' + ms + ' ms — ' + snap.size + ' publication(s) lue(s)');
    snap.forEach(d => afficherPost(d.data()));
    if (snap.docs.length) curseur = snap.docs[snap.docs.length - 1];
    if (snap.docs.length < TAILLE) fin = true;
    document.getElementById('btnPlus').style.display = fin ? 'none' : 'block';
  } catch(err) {
    clearInterval(iv);
    const ms = Date.now() - debut;
    statut('fail', '❌ Échec après ' + ms + ' ms\n' + (err && err.message ? err.message : String(err)));
  }
}

window.chargerSuite = async function(){
  if (fin || !curseur) return;
  const btn = document.getElementById('btnPlus');
  btn.disabled = true; btn.textContent = 'Chargement…';
  try {
    const q = query(collection(db,'publications'), orderBy('createdAt','desc'), startAfter(curseur), limit(TAILLE));
    const snap = await avecDelaiMax(getDocs(q), 10000);
    snap.forEach(d => afficherPost(d.data()));
    if (snap.docs.length) curseur = snap.docs[snap.docs.length - 1];
    if (snap.docs.length < TAILLE) { fin = true; btn.style.display = 'none'; }
  } catch(err) {
    statut('fail', '❌ Échec du chargement suivant : ' + (err && err.message ? err.message : String(err)));
  } finally {
    btn.disabled = false; btn.textContent = 'Charger 4 de plus';
  }
};

let utilisateurConnecte = null;
onAuthStateChanged(auth, (user) => {
  if (!user) { statut('fail', '❌ Pas connecté. Connecte-toi d\'abord sur connexion.html, puis reviens sur cette page.'); return; }
  utilisateurConnecte = user;
  statut('attente', '✅ Connecté comme ' + (user.email || user.uid) + '. Lecture des publications…');
  chargerPremiere();
});

window.testToken = async function(){
  const el = document.getElementById('statutToken');
  if (!utilisateurConnecte) { el.className='statut fail'; el.textContent = '❌ Pas encore connecté, attends un peu et réessaie.'; return; }
  el.className = 'statut attente';
  const debut = Date.now();
  let secs = 0;
  const iv = setInterval(() => {
    secs = Math.floor((Date.now()-debut)/1000);
    el.textContent = '⏳ Récupération du jeton en cours… ' + secs + 's écoulées';
  }, 1000);
  try {
    const token = await Promise.race([
      utilisateurConnecte.getIdToken(true),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Délai dépassé après 15s — impossible de récupérer le jeton.')), 15000))
    ]);
    clearInterval(iv);
    const ms = Date.now() - debut;
    el.className = 'statut ok';
    el.textContent = '✅ Jeton recupere en ' + ms + ' ms !\nLongueur du jeton : ' + token.length + ' caracteres.';
  } catch(err) {
    clearInterval(iv);
    const ms = Date.now() - debut;
    el.className = 'statut fail';
    el.textContent = '❌ Echec apres ' + ms + ' ms\n' + (err && err.message ? err.message : String(err));
  }
};

// Extrait une valeur simple d'un champ au format REST Firestore ({stringValue:...}, {integerValue:...}, etc.)
function valeurChampRest(champ){
  if (!champ) return '';
  if ('stringValue' in champ) return champ.stringValue;
  if ('integerValue' in champ) return champ.integerValue;
  if ('booleanValue' in champ) return String(champ.booleanValue);
  return '';
}

window.testLectureRest = async function(){
  const el = document.getElementById('statutRest');
  const liste = document.getElementById('listeRest');
  liste.innerHTML = '';
  if (!utilisateurConnecte) { el.className='statut fail'; el.textContent = '❌ Pas encore connecté.'; return; }
  el.className = 'statut attente';
  const debut = Date.now();
  let secs = 0;
  const iv = setInterval(() => {
    secs = Math.floor((Date.now()-debut)/1000);
    el.textContent = '⏳ Lecture REST en cours… ' + secs + 's écoulées';
  }, 1000);
  try {
    const token = await utilisateurConnecte.getIdToken();
    const url = 'https://firestore.googleapis.com/v1/projects/artiroyce-f42e4/databases/(default)/documents:runQuery';
    const corps = {
      structuredQuery: {
        from: [{ collectionId: 'publications' }],
        orderBy: [{ field: { fieldPath: 'createdAt' }, direction: 'DESCENDING' }],
        limit: 4
      }
    };
    const reponse = await Promise.race([
      fetch(url, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify(corps)
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Delai depasse apres 15s')), 15000))
    ]);
    clearInterval(iv);
    const ms = Date.now() - debut;
    const data = await reponse.json();
    if (!reponse.ok) {
      el.className = 'statut fail';
      el.textContent = '❌ Code HTTP ' + reponse.status + ' apres ' + ms + ' ms\n' + JSON.stringify(data).substring(0,300);
      return;
    }
    let compte = 0;
    data.forEach(item => {
      if (item.document && item.document.fields) {
        compte++;
        const f = item.document.fields;
        const div = document.createElement('div');
        div.className = 'post';
        div.innerHTML = '<b>' + (valeurChampRest(f.auteurNom) || 'Anonyme') + '</b>' + (valeurChampRest(f.texte) || '(sans texte)').substring(0,120);
        liste.appendChild(div);
      }
    });
    el.className = 'statut ok';
    el.textContent = '✅ SUCCES en ' + ms + ' ms — ' + compte + ' publication(s) lue(s) via REST direct !';
  } catch(err) {
    clearInterval(iv);
    const ms = Date.now() - debut;
    el.className = 'statut fail';
    el.textContent = '❌ Echec apres ' + ms + ' ms\n' + (err && err.message ? err.message : String(err));
  }
};

window.testBrut = async function(){
  const el = document.getElementById('statutBrut');
  el.className = 'statut attente';
  const debut = Date.now();
  let secs = 0;
  const iv = setInterval(() => {
    secs = Math.floor((Date.now()-debut)/1000);
    el.textContent = '⏳ Requête brute en cours (fetch, sans SDK)… ' + secs + 's écoulées';
  }, 1000);
  try {
    const url = 'https://firestore.googleapis.com/v1/projects/artiroyce-f42e4/databases/(default)/documents/publications?pageSize=1';
    const reponse = await Promise.race([
      fetch(url),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Délai dépassé après 15s')), 15000))
    ]);
    clearInterval(iv);
    const ms = Date.now() - debut;
    const texte = await reponse.text();
    el.className = 'statut ok';
    el.textContent = '✅ Le serveur a répondu en ' + ms + ' ms !\nCode HTTP : ' + reponse.status + '\n\n(Un code 403 ici est normal et bon signe : ca veut dire que le serveur repond bien, juste qu il refuse sans jeton d authentification. C est ATTENDU pour ce test brut.)\n\nDebut de la reponse :\n' + texte.substring(0,200);
  } catch(err) {
    clearInterval(iv);
    const ms = Date.now() - debut;
    el.className = 'statut fail';
    el.textContent = '❌ Échec après ' + ms + ' ms\n' + (err && err.message ? err.message : String(err)) + '\n\nSi ça bloque ici aussi, le problème est un blocage réseau total vers firestore.googleapis.com, avant même d\'arriver à Firebase.';
  }
};
</script>
</body>
</html>
