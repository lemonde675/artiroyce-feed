<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Fil Presse — ArtiRoyce</title>
<link rel="preconnect" href="https://www.gstatic.com">

<style>
:root{--red:#e63224;--green:#27a945;--bg:#F2F4F7}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior-x:none;touch-action:pan-y}
.body-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100vh;height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column;background:var(--bg);overscroll-behavior-x:none}
.spacer{flex-shrink:0}
.top-header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.th-row{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 4px}
.th-logo{font-size:22px;font-weight:900;line-height:1;letter-spacing:-0.5px}
.th-logo .a{color:var(--red)}.th-logo .r{color:var(--green)}
.lang-sel{display:flex;align-items:center;gap:4px;background:#F2F4F7;border-radius:20px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid #E8ECF0}
.h-icons{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-bar{display:none;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #eee}
.search-bar.show{display:flex}
.search-bar input{flex:1;border:1px solid #E8ECF0;border-radius:20px;padding:9px 14px;font-size:13.5px;background:#F2F4F7;color:#222}
.search-close{font-size:16px;color:#999;cursor:pointer;padding:4px 6px;flex-shrink:0}
.cover-carousel-wrap{background:#fff;padding:14px 0 16px;border-bottom:8px solid var(--bg)}
.cover-carousel-title{font-size:15px;font-weight:800;color:#222;padding:0 14px 10px}
.cover-carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:0 14px 4px;scrollbar-width:none;cursor:grab;touch-action:pan-x}
.cover-carousel::-webkit-scrollbar{display:none}
.cover-carousel::-webkit-scrollbar{display:none}
.cover-card{position:relative;flex:0 0 auto;width:130px;height:160px;border-radius:14px;overflow:hidden;scroll-snap-align:start;background:#ddd;cursor:pointer}
.cover-card img{width:100%;height:100%;object-fit:cover;display:block}
.cover-card-overlay{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 8px;background:linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0))}
.cover-card-journal{color:#fff;font-size:12.5px;font-weight:800;margin-bottom:2px}
.cover-card-txt{color:#eee;font-size:10.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h-ico{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0}
.h-ico.bell{background:#fff8e1;border:2px solid #ffc107}
.h-ico.chat{background:#e8f5e9;border:2px solid var(--green)}
.h-ico.chat .bdot{background:var(--green)}
.h-ico .bdot{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

.composer{background:#fff;flex-shrink:0;border-bottom:1px solid #eee}
.composer-row{display:flex;align-items:center;gap:10px;padding:12px 14px}
.search-circle-btn{width:40px;height:40px;border-radius:50%;background:#F2F4F7;border:1px solid #E8ECF0;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0}
.search-circle-btn:active{background:#E8ECF0}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;flex-shrink:0}
.online-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2.5px solid #fff}
.v-icon{position:absolute;top:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:var(--green);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:900}
.composer-input{flex:1;background:#F2F4F7;border-radius:22px;padding:10px 16px;font-size:14px;color:#777;border:none;cursor:pointer}
.composer-locked{font-size:12px;color:#999;text-align:center;padding:8px 14px 12px}

.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:none}
.content::-webkit-scrollbar{display:none}
.sec-title{font-size:12.5px;font-weight:800;color:#999;text-transform:uppercase;letter-spacing:.5px;padding:14px 16px 6px;background:var(--bg)}
.trash-toggle{margin:0 14px 8px;background:#fff;border:1px solid #E8ECF0;border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700;color:#e63224;display:flex;align-items:center;justify-content:space-between;cursor:pointer}

.post{background:#fff;margin-bottom:8px}
.post-hd{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.post-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-name{font-size:14.5px;font-weight:800;color:#222}
.badge-metier{background:#F2F4F7;border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700;color:#555;display:inline-flex;align-items:center;gap:3px}
.badge-off{background:var(--green);color:#fff;border-radius:12px;padding:2px 9px;font-size:11px;font-weight:800}
.post-sub{font-size:12px;color:#999;margin-top:1px}
.post-txt{padding:2px 14px 10px;font-size:15.5px;color:#000000;line-height:1.35;font-weight:500}
.post-imgs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.post-imgs{display:grid;gap:4px;margin:0 14px 10px;border-radius:14px;overflow:hidden;background:#eee}
.post-imgs img{width:100%;object-fit:cover;display:block;background:#eee}
.post-stats{display:flex;justify-content:space-between;padding:9px 14px;font-size:12.5px;color:#999}
.post-actions{display:flex;border-top:1px solid #f2f2f2}
.pa-btn{flex:1;text-align:center;padding:11px 4px;font-size:12.5px;font-weight:700;color:#777;cursor:pointer}
.post-trash-actions{display:flex;gap:8px;padding:0 14px 12px}
.pt-btn{flex:1;text-align:center;background:#F2F4F7;color:#444;padding:8px;border-radius:12px;font-size:11.5px;font-weight:700;cursor:pointer;touch-action:manipulation}
.empty-msg{text-align:center;color:#aaa;font-size:13px;padding:30px 20px}
.type-chip{border:1.5px solid #E8ECF0;border-radius:14px;padding:7px 12px;font-size:12.5px;font-weight:700;color:#555;cursor:pointer}
.type-chip.active{color:#fff;border-color:transparent}
.ribbon-wrap{text-align:center;margin-bottom:8px}
.ribbon{display:inline-flex;align-items:center;gap:5px;color:#fff;font-size:11.5px;font-weight:800;padding:5px 16px;border-radius:20px}
.ribbon-journal{display:block;font-size:15px;font-weight:800;color:#222;margin-top:4px}
.follow-btn{border:1.5px solid var(--red);color:var(--red);background:#fff;border-radius:14px;padding:4px 12px;font-size:12px;font-weight:800;cursor:pointer;margin-left:8px;flex-shrink:0}
.follow-btn.on{background:#eee;color:#777;border-color:#eee}
.own-actions{display:flex;gap:8px;margin:0 14px 10px}
.oa-btn{flex:1;text-align:center;background:#F2F4F7;border-radius:12px;padding:8px;font-size:11.5px;font-weight:700;color:#444;cursor:pointer;touch-action:manipulation}
.composer-notice{display:none;margin-top:10px;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;line-height:1.4}
.upload-progress-wrap{display:none;margin-top:10px;background:#F2F4F7;border-radius:6px;height:6px;overflow:hidden}
.upload-progress-bar{height:100%;width:0%;background:var(--green);border-radius:6px;transition:width .15s}
.react-picker{display:none;gap:2px;padding:6px 8px;border-top:1px solid #f2f2f2;background:#fafafa;justify-content:space-between}
.react-picker.show{display:flex}
.react-em{font-size:24px;cursor:pointer;transition:transform .1s;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;flex:1;touch-action:manipulation}
.react-em:active{transform:scale(1.25);background:#eee}
.comments-box{display:none;padding:10px 14px;border-top:1px solid #f2f2f2;background:#fafafa}
.comments-box.show{display:block}
.cmt-item{display:flex;gap:8px;margin-bottom:6px}
.cmt-av{width:28px;height:28px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#666;flex-shrink:0}
.cmt-right{flex:1;min-width:0}
.cmt-bubble{background:#fff;border-radius:14px;padding:7px 10px;font-size:12.5px;display:inline-block;max-width:100%}
.cmt-bubble b{font-size:12px}
.cmt-badge-createur{color:#999;font-size:11px;font-weight:600;margin-left:4px}
.cmt-meta{display:flex;align-items:center;gap:12px;margin:3px 2px 0;font-size:11px;color:#999}
.cmt-meta span{cursor:pointer}
.cmt-like.liked{color:var(--red);font-weight:800}
.cmt-like-count{display:none;align-items:center;gap:3px}
.cmt-replies-zone{margin-left:34px}
.cmt-reply-wrap{margin-top:6px}
.cmt-voir-plus{font-size:11.5px;color:#666;font-weight:700;cursor:pointer;margin:4px 0 6px 34px}
.cmt-reply-indicator{display:none;align-items:center;gap:6px;font-size:11.5px;color:#666;background:#eef0f3;border-radius:10px;padding:6px 10px;margin-top:8px}
.cmt-reply-indicator span{cursor:pointer;color:#999;margin-left:auto}
.cmt-input-row{display:flex;gap:8px;margin-top:6px}
.cmt-input{flex:1;border:1px solid #E8ECF0;border-radius:14px;padding:8px 12px;font-size:13px}
.cmt-send{background:var(--red);color:#fff;border:none;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
</style>

<script>
function majVh(){
  const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  document.documentElement.style.setProperty('--vh',(h*0.01)+'px');
}
majVh();
window.addEventListener('resize',majVh);
if(window.visualViewport){window.visualViewport.addEventListener('resize',majVh);window.visualViewport.addEventListener('scroll',majVh);}

function adj(){const hh=document.getElementById('topH').offsetHeight;document.getElementById('spacer').style.height=hh+'px'}
window.addEventListener('load',adj);window.addEventListener('resize',adj);setTimeout(adj,100);

// Même correctif que discussion_v1.html : calcule directement la vraie hauteur du
// header FIXE du shell parent (accueil.html) quand cette page est en iframe, pour
// ne jamais cacher le composeur/le contenu dessous. Ne dépend d'aucun message
// (accueil.html n'en envoie pas) : le calcul est direct et sans risque.
function getEmbedTopOffsetPx(){
  try {
    if (window.parent && window.parent !== window && window.parent.document) {
      const parentTop = window.parent.document.getElementById('topH');
      if (parentTop) return parentTop.getBoundingClientRect().height;
    }
  } catch(e) {}
  return 0;
}
let embedTopOffsetPx = 0;
function appliquerDecalage(){
  document.querySelector('.body-wrap').style.paddingTop = embedTopOffsetPx + 'px';
}
embedTopOffsetPx = getEmbedTopOffsetPx();
appliquerDecalage();
window.addEventListener('load', ()=>{ embedTopOffsetPx = getEmbedTopOffsetPx(); appliquerDecalage(); });
window.addEventListener('resize', ()=>{ embedTopOffsetPx = getEmbedTopOffsetPx(); appliquerDecalage(); });
setTimeout(()=>{ embedTopOffsetPx = getEmbedTopOffsetPx(); appliquerDecalage(); }, 300);

function hideEmbeddedChrome(){
  const th=document.getElementById('topH');
  if(th) th.style.setProperty('display','none','important');
  const sp=document.getElementById('spacer');
  if(sp) sp.style.setProperty('height','0px','important');
}
window.addEventListener('message',(e)=>{
  if(e.data && e.data.type==='parentFrame') hideEmbeddedChrome();
});
</script>

// ── Couche de compatibilité ──────────────────────────────────────────
// Le reste du fichier a été écrit avec la syntaxe des modules Firebase
// (doc(db,...), getDocs(...), etc.). Plutôt que de réécrire ~90 appels

function fsRef(){
  var args = Array.prototype.slice.call(arguments);
  var r = db, i = 0;
  while(i < args.length){
    r = r.collection(args[i]); i++;
    if(i < args.length){ r = r.doc(String(args[i])); i++; }
  }
  return r;
}
function doc(){ var a = Array.prototype.slice.call(arguments, 1); return fsRef.apply(null, a); }
function collection(){ var a = Array.prototype.slice.call(arguments, 1); return fsRef.apply(null, a); }
function getDoc(ref){ return ref.get(); }
function getDocs(ref){ return ref.get(); }
function addDoc(colRef, data){ return colRef.add(data); }
function updateDoc(ref, data){ return ref.update(data); }
function deleteDoc(ref){ return ref.delete(); }
function setDoc(ref, data, opts){ return opts ? ref.set(data, opts) : ref.set(data); }
function where(field, op, val){ return function(r){ return r.where(field, op, val); }; }
function orderBy(field, dir){ return function(r){ return r.orderBy(field, dir); }; }
function query(baseRef){
  var fns = Array.prototype.slice.call(arguments, 1);
  var r = baseRef;
  fns.forEach(function(fn){ r = fn(r); });
  return r;
}
function serverTimestamp(){ return firebase.firestore.FieldValue.serverTimestamp(); }
function increment(n){ return firebase.firestore.FieldValue.increment(n); }
const Timestamp = firebase.firestore.Timestamp;


const FIFTEEN_DAYS_MS = 15*24*60*60*1000;

function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.max(0, Date.now()-d.getTime());
  const h = Math.floor(diff/3600000);
  if(h<1) return "à l'instant";
  if(h<24) return 'il y a '+h+'h';
  const j = Math.floor(h/24);
  if(j<30) return 'il y a '+j+'j';
  return 'il y a '+Math.floor(j/30)+' mois';
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let allMineActive = [];
let allOthers = [];
let searchTerm = '';

const TAILLE_LOT_FP = 6;
let nombreAffichesAutres = TAILLE_LOT_FP;
let followedUidsFilPresse = new Set();
let monPaysPrefixe = '';
const _ordreAleatoireStableFP = {};

// Approximation de l'indicatif pays à partir du numéro de téléphone (3
// premiers chiffres), même principe que sur Actualités/Offres.
function extraireIndicatifTelephone(telephone){
  if(!telephone) return '';
  const chiffres = String(telephone).replace(/\D/g, '');
  return chiffres.slice(0, 3);
}

function ordreAleatoireStableFP(id){
  if(!(id in _ordreAleatoireStableFP)) _ordreAleatoireStableFP[id] = Math.random();
  return _ordreAleatoireStableFP[id];
}
function melangerAleatoirementFP(liste){
  return liste.slice().sort(function(a,b){ return ordreAleatoireStableFP(a[0]) - ordreAleatoireStableFP(b[0]); });
}

/* Classement des publications des autres, par palier :
   1. Les personnes que je suis
   2. Même pays (indicatif téléphonique, approximatif)
   3. Le reste, mélangé de façon stable (pas remélangé à chaque rafraîchissement)
   "Mes publications" a déjà sa propre section séparée en haut, donc pas de
   palier "moi" ici. Protégé par son propre filet de sécurité : en cas de
   souci, on revient à l'ordre par date. */
function trierAutresParPriorite(liste){
  try{
    if(!Array.isArray(liste) || liste.length < 2) return liste;
    const suivis = [], memePays = [], reste = [];
    liste.forEach(function(x){
      const p = x[1];
      if(p.uid && followedUidsFilPresse.has(p.uid)) suivis.push(x);
      else if(monPaysPrefixe && p.paysPrefixe && p.paysPrefixe === monPaysPrefixe) memePays.push(x);
      else reste.push(x);
    });
    return suivis.concat(memePays, melangerAleatoirementFP(reste));
  }catch(e){
    console.error('Tri par priorité Fil Presse impossible, retour à l\'ordre par date :', e);
    return liste;
  }
}

function matchesSearch(p){
  if(!searchTerm) return true;
  const hay = ((p.journalNom||'') + ' ' + (p.prenom||'') + ' ' + (p.texte||'') + ' ' + (p.ville||'')).toLowerCase();
  return hay.indexOf(searchTerm) !== -1;
}

function renderFilteredFeed(){
  const mineFiltered = allMineActive.filter(function(x){ return matchesSearch(x[1]); });
  const othersFilteredBrut = allOthers.filter(function(x){ return matchesSearch(x[1]); });
  const othersFiltered = trierAutresParPriorite(othersFilteredBrut);
  const visibles = othersFiltered.slice(0, nombreAffichesAutres);

  document.getElementById('mineList').innerHTML = mineFiltered.map(function(x){return renderPost(x[0],x[1],{mine:true});}).join('');
  document.getElementById('secMineTitle').style.display = mineFiltered.length ? '' : 'none';

  const carouselBlock = buildCoverCarouselBlock();
  let feedHTML = '';
  if(visibles.length){
    const total = visibles.length;
    const useEveryFive = total >= 5;
    const midPoint = Math.max(1, Math.floor(total / 2));
    visibles.forEach(function(x, i){
      feedHTML += renderPost(x[0], x[1], {mine:false});
      if(carouselBlock){
        if(useEveryFive){
          if((i + 1) % 5 === 0) feedHTML += carouselBlock;
        } else if((i + 1) === midPoint){
          feedHTML += carouselBlock;
        }
      }
    });
  } else {
    feedHTML = '<div class="empty-msg">'+(searchTerm ? 'Aucun résultat pour « '+esc(searchTerm)+' ».' : 'Aucune publication pour le moment.')+'</div>';
  }
  document.getElementById('feedList').innerHTML = feedHTML;

  markFollowedButtons();
  markAuthorsOnline();
  mineFiltered.concat(visibles).forEach(function(x){ refreshReactionCount(x[0]); });
}

// Chargement progressif au défilement, comme Actualités/Offres/Élite —
// jamais tout le fil d'un coup.
const observateurFP = new IntersectionObserver(function(entrees){
  entrees.forEach(function(entree){
    if(entree.isIntersecting){
      const othersFiltered = trierAutresParPriorite(allOthers.filter(function(x){ return matchesSearch(x[1]); }));
      if(nombreAffichesAutres < othersFiltered.length){
        nombreAffichesAutres += TAILLE_LOT_FP;
        renderFilteredFeed();
      }
    }
  });
}, { rootMargin: '400px' });
setTimeout(function(){
  const sentinelle = document.getElementById('sentinelleFP');
  if(sentinelle) observateurFP.observe(sentinelle);
}, 500);

// Auto-défilement partagé : fait avancer TOUTES les instances de carrousel
// présentes dans le fil (il peut y en avoir plusieurs, une toutes les 10 pubs).
// Se met en pause dès qu'on touche l'une d'entre elles.
let coverPausedUntil = 0;

setInterval(function(){
  if(Date.now() < coverPausedUntil) return;
  document.querySelectorAll('.cover-carousel').forEach(function(track){
    const maxScroll = track.scrollWidth - track.clientWidth;
    if(maxScroll <= 2) return;
    if(track.scrollLeft >= maxScroll - 2){
      track.scrollTo({ left: 0, behavior: 'smooth' });
    } else {
      track.scrollTo({ left: track.scrollLeft + 160, behavior: 'smooth' });
    }
  });
}, 3000);

document.getElementById('content').addEventListener('touchstart', function(e){
  if(e.target.closest('.cover-carousel')) coverPausedUntil = Date.now() + 4000;
}, { passive: true });

// Glissement à la souris pour le carrousel (ordinateur/portable) — équivalent du
// glissement au doigt sur mobile, qui fonctionne déjà nativement.
let dragTrack = null, dragStartX = 0, dragScrollStart = 0;
document.getElementById('content').addEventListener('mousedown', function(e){
  const track = e.target.closest('.cover-carousel');
  if(track){
    dragTrack = track;
    dragStartX = e.pageX;
    dragScrollStart = track.scrollLeft;
  }
  if(e.target.closest('.cover-carousel')) coverPausedUntil = Date.now() + 4000;
});
window.addEventListener('mousemove', function(e){
  if(!dragTrack) return;
  dragTrack.scrollLeft = dragScrollStart - (e.pageX - dragStartX);
});
window.addEventListener('mouseup', function(){ dragTrack = null; });

window.__scrollToPost = function(id){
  const el = document.getElementById('post-' + id);
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// Construit un bloc "Nos parutions" (publications illustrées récentes), destiné
// à être inséré directement dans le fil, comme les suggestions Facebook.
function buildCoverCarouselBlock(){
  const combined = allMineActive.concat(allOthers)
    .filter(function(x){ return (x[1].images || []).length > 0; })
    .slice(0, 12);
  if(!combined.length) return '';

  const cards = combined.map(function(x){
    const id = x[0], p = x[1];
    const journal = esc(p.journalNom || p.prenom || 'ArtiRoyce');
    const snippet = esc((p.texte || '').slice(0, 55));
    return '<div class="cover-card" onclick="window.__scrollToPost(\'' + id + '\')">'
      + '<img src="' + esc(p.images[0]) + '" loading="lazy" referrerpolicy="no-referrer">'
      + '<div class="cover-card-overlay"><div class="cover-card-journal">' + journal + '</div><div class="cover-card-txt">' + snippet + '</div></div>'
      + '</div>';
  }).join('');

  return '<div class="cover-carousel-wrap">'
    + '<div class="cover-carousel-title">📰 Nos parutions</div>'
    + '<div class="cover-carousel">' + cards + '</div>'
    + '</div>';
}

async function loadFeed(){
  try{
    const col = collection(db, 'fil_presse');
    const snap = await getDocs(query(col, orderBy('createdAt','desc')));

    const mineActive = [];
    const others = [];
    const mineTrashed = [];
    const now = Date.now();

    snap.forEach(function(d){
      const p = d.data();
      const isMine = currentUid && p.uid === currentUid;
      const isDeleted = !!p.deletedAt;

      if(isDeleted){
        if(isMine){
          const delTime = p.deletedAt.toDate ? p.deletedAt.toDate().getTime() : new Date(p.deletedAt).getTime();
          if(now - delTime > FIFTEEN_DAYS_MS){
            deleteDoc(doc(db,'fil_presse', d.id)).catch(function(){});
          } else {
            mineTrashed.push([d.id, p]);
          }
        }
        return;
      }
      if(isMine) mineActive.push([d.id, p]);
      else others.push([d.id, p]);
    });

    allMineActive = mineActive;
    allOthers = others;
    nombreAffichesAutres = TAILLE_LOT_FP;
    renderFilteredFeed();

    const trashToggle = document.getElementById('trashToggle');
    const trashCount = document.getElementById('trashCount');
    const trashList = document.getElementById('trashList');
    trashCount.textContent = mineTrashed.length;
    trashToggle.style.display = mineTrashed.length ? 'flex' : 'none';
    trashList.innerHTML = mineTrashed.map(function(x){return renderPost(x[0],x[1],{mine:true, trashed:true});}).join('');
  }catch(err){
    console.error('Fil Presse — chargement impossible :', err);
    document.getElementById('feedList').innerHTML =
      '<div class="empty-msg">⚠️ Impossible de charger le Fil Presse pour le moment.<br>'
      + '(Vérifie que Firebase Blaze est bien actif sur le projet.)</div>';
  }
}

// Glissement gauche/droite pour changer d'onglet (Répert-Discussion / Fil Presse / FAQ),
// comme un swipe classique. Si la page est intégrée dans accueil.html et qu'une fonction
// switchTab existe côté parent, on l'utilise ; sinon on essaie un postMessage générique ;
// en dernier recours (page ouverte seule, hors iframe), navigation directe.
(function(){
  let touchStartX = 0, touchStartY = 0, tracking = false, locked = null; // locked: 'h' (horizontal) | 'v' (vertical) | null
  const SWIPE_MIN = 25;      // distance totale minimale pour valider le glissement
  const LOCK_THRESHOLD = 10; // dès ce petit mouvement, on décide si c'est horizontal ou vertical

  function goToAdjacentPage(direction){
    try{
      if(window.parent && window.parent !== window && typeof window.parent.switchTab === 'function'){
        window.parent.switchTab(direction);
        return;
      }
    }catch(e){}
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ action: 'swipeNav', direction: direction, from: 'fil-presse' }, '*');
        return;
      }
    }catch(e){}
    // Repli si la page n'est pas intégrée en iframe
    if(direction === 'next') window.location.href = 'faq_v1.html';
    else window.location.href = 'discussion_v1.html';
  }

  document.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    const modal = document.getElementById('composerModal');
    if(modal && modal.style.display === 'block'){ tracking = false; return; }
    if(e.target.closest('.cover-carousel, input, textarea')){ tracking = false; return; }
    tracking = true;
    locked = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  // Dès qu'on a assez de mouvement pour juger, on verrouille la direction du geste.
  // Un geste jugé vertical (défilement normal) ne pourra plus jamais déclencher
  // un changement de page, même s'il dérive ensuite horizontalement.
  document.addEventListener('touchmove', function(e){
    if(!tracking || locked || !e.touches.length) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if(Math.abs(dx) < LOCK_THRESHOLD && Math.abs(dy) < LOCK_THRESHOLD) return;
    locked = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
  }, { passive: true });

  document.addEventListener('touchend', function(e){
    const wasHorizontal = tracking && locked === 'h';
    tracking = false;
    locked = null;
    if(!wasHorizontal || !e.changedTouches || !e.changedTouches.length) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) < SWIPE_MIN) return;

    if(dx < 0) goToAdjacentPage('next'); // glissement vers la gauche -> page suivante
    else goToAdjacentPage('prev');       // glissement vers la droite -> page précédente
  }, { passive: true });
})();

// Redimensionne et compresse une image côté client avant de l'encoder en base64.
// Évite toute dépendance à Firebase Storage pour les photos (indépendant de Blaze).
function resizeImageToBase64(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onerror = function(){ reject(new Error("Lecture de l'image impossible")); };
    reader.onload = function(){
      const img = new Image();
      img.onerror = function(){ reject(new Error('Fichier image invalide')); };
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Upload vidéo avec vraie progression (uploadBytesResumable) + garde-fou temporel :
// si Storage ne répond pas (Blaze inactif), on abandonne proprement après 45s
// au lieu de rester bloqué, et la publication continue sans vidéo.
function uploaderVideo(file, btnEl){
  return new Promise(function(resolve, reject){
    const path = 'fil_presse/' + currentUid + '_' + Date.now() + '_' + file.name;
    const r = storage.ref(path);
    const task = r.put(file);
    const progressWrap = document.getElementById('uploadProgressWrap');
    const progressBar = document.getElementById('uploadProgressBar');
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';
    const failSafe = setTimeout(function(){ try{ task.cancel(); }catch(e){} }, 45000);
    task.on('state_changed', function(snap){
      const pct = snap.totalBytes ? Math.round((snap.bytesTransferred / snap.totalBytes) * 100) : 0;
      progressBar.style.width = pct + '%';
      if(btnEl) btnEl.textContent = 'Envoi vidéo… ' + pct + '%';
    }, function(err){
      clearTimeout(failSafe);
      progressWrap.style.display = 'none';
      reject(err);
    }, function(){
      clearTimeout(failSafe);
      progressWrap.style.display = 'none';
      task.snapshot.ref.getDownloadURL().then(resolve).catch(reject);
    });
  });
}

// fil_presse/{postId}/comments/{commentId}/likes/{uid} — exactement le même principe

window.__toggleCommentLike = async function(postId, commentId, likeEl, countWrapEl, numEl){
  if(!currentUid){ alert('Connecte-toi pour aimer un commentaire.'); return; }
  const likeRef = doc(db, 'fil_presse', postId, 'comments', commentId, 'likes', currentUid);
  const commentRef = doc(db, 'fil_presse', postId, 'comments', commentId);
  try{
    const likeSnap = await getDoc(likeRef);
    if(likeSnap.exists){
      await deleteDoc(likeRef);
      await updateDoc(commentRef, { likes: increment(-1) });
      likeEl.classList.remove('liked');
      likeEl.textContent = "J'aime";
    } else {
      await setDoc(likeRef, { uid: currentUid, createdAt: serverTimestamp() });
      await updateDoc(commentRef, { likes: increment(1) });
      likeEl.classList.add('liked');
      likeEl.textContent = 'Aimé';
    }
    const freshSnap = await getDoc(commentRef);
    const likes = freshSnap.exists ? (freshSnap.data().likes || 0) : 0;
    if(countWrapEl) countWrapEl.style.display = likes > 0 ? 'inline-flex' : 'none';
    if(numEl) numEl.textContent = likes;
  }catch(e){ console.error('Like commentaire impossible :', e); }
};

    + '<div class="cmt-item">'
    +   '<div class="cmt-av" style="cursor:pointer" onclick="window.__voirProfil(\''+(c.uid||'')+'\')">'+ini+'</div>'
    +   '<div class="cmt-right">'
    +     '<div class="cmt-bubble"><b style="cursor:pointer" onclick="window.__voirProfil(\''+(c.uid||'')+'\')">'+esc(c.prenom||'Utilisateur')+'</b>'+(isCreateur ? '<span class="cmt-badge-createur">· Créateur</span>' : '')+'<br>'+esc(c.texte)+'</div>'
    +     '<div class="cmt-meta">'
    +       '<span>'+(c.ville?esc(c.ville)+' · ':'')+timeAgo(c.createdAt)+'</span>'
    +       '<span class="cmt-like'+(liked?' liked':'')+'" id="cmtLike-'+c.id+'" onclick="window.__toggleCommentLike(\''+postId+'\',\''+c.id+'\', this, document.getElementById(\'cmtLikeCount-'+c.id+'\'), document.getElementById(\'cmtLikeNum-'+c.id+'\'))">'+(liked?'Aimé':"J'aime")+'</span>'
    +       '<span onclick="window.__replyToComment(\''+postId+'\',\''+c.id+'\',\''+rootId+'\',\''+esc(c.prenom||'Utilisateur')+'\')">Répondre</span>'
    +       '<span class="cmt-like-count" id="cmtLikeCount-'+c.id+'" style="display:'+(likes>0?'inline-flex':'none')+'">❤️ <span id="cmtLikeNum-'+c.id+'">'+likes+'</span></span>'
    +     '</div>'
    +   '</div>'

    + '</div>';

async function loadComments(postId){
  const listEl = document.getElementById('cmtList-'+postId);
  listEl.innerHTML = '<div style="font-size:12px;color:#999">Chargement…</div>';
  const authorUid = findPostAuthorUid(postId);
  const snap = await getDocs(query(collection(db,'fil_presse', postId, 'comments'), orderBy('createdAt','asc')));
  if(snap.empty){
    listEl.innerHTML = '<div style="font-size:12px;color:#999">Aucun commentaire pour le moment.</div>';
    return;
  }

  const tous = [];
  snap.forEach(function(d){ tous.push(Object.assign({ id: d.id }, d.data())); });

  // Récupère, pour l'utilisateur connecté, quels commentaires il a déjà aimés —
  // en parallèle, pour que l'état "Aimé" soit correct dès l'ouverture (persistant).
  const likedMap = {};
  if(currentUid){
    await Promise.all(tous.map(async function(c){
      try{
        const likeRef = doc(db, 'fil_presse', postId, 'comments', c.id, 'likes', currentUid);
        const likeSnap = await getDoc(likeRef);
        likedMap[c.id] = likeSnap.exists;
      }catch(e){ likedMap[c.id] = false; }
    }));
  }

  const parentDe = {};
  tous.forEach(function(c){ parentDe[c.id] = c.parentId || null; });
  function trouverRacine(id){
    let cur = id, garde = 0;
    while(parentDe[cur] && garde < 20){ cur = parentDe[cur]; garde++; }
    return cur;
  }

  const principaux = tous.filter(function(c){ return !c.parentId; })
    .sort(function(a,b){
      const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta; // plus récents en premier
    });

  const reponsesParRacine = {};
  tous.filter(function(c){ return c.parentId; }).forEach(function(c){
    const racine = trouverRacine(c.id);
    (reponsesParRacine[racine] = reponsesParRacine[racine] || []).push(c);
  });

  let html = '';
  principaux.forEach(function(c){
    html += buildCommentHTML(postId, c, authorUid, false, c.id, likedMap);
    const reponses = reponsesParRacine[c.id] || [];
    if(reponses.length){
      html += '<div class="cmt-replies-zone" id="cmtReplies-'+c.id+'">'
        + '<div class="cmt-voir-plus" id="cmtToggle-'+c.id+'">— Afficher '+reponses.length+' réponse'+(reponses.length>1?'s':'')+' ▾</div>'
        + '</div>';
    }
  });
  listEl.innerHTML = html;

  // Câblage des replis "Afficher X réponses" (construits après coup pour garder le HTML léger au premier rendu)
  principaux.forEach(function(c){
    const reponses = reponsesParRacine[c.id] || [];
    if(!reponses.length) return;
    const toggle = document.getElementById('cmtToggle-'+c.id);
    const zone = document.getElementById('cmtReplies-'+c.id);
    if(!toggle || !zone) return;
    toggle.onclick = function(){
      const repsHTML = reponses.map(function(r){ return buildCommentHTML(postId, r, authorUid, true, c.id, likedMap); }).join('');
      zone.innerHTML = repsHTML;
    };
  });
}

window.__addComment = async function(postId){
  if(!currentUid){ alert('Connecte-toi pour commenter.'); return; }
  const input = document.getElementById('cmtInput-'+postId);
  const texte = input.value.trim();
  if(!texte) return;
  const target = replyTargets[postId];
  await addDoc(collection(db,'fil_presse', postId, 'comments'), {

    ville: (currentUserData && currentUserData.ville) || '',

    parentId: target ? target.parentId : null,
    createdAt: serverTimestamp()
  });
  input.value = '';
  window.__cancelReply(postId);
  await loadComments(postId);
  const postRef = doc(db,'fil_presse', postId);
  const snap = await getDocs(collection(db,'fil_presse', postId, 'comments'));
  await updateDoc(postRef, { comments: snap.size });
  const el = document.getElementById('stats-'+postId);
  if(el){ el.querySelectorAll('span')[1].textContent = snap.size + ' commentaire(s)'; }
}

async function initComposer(){
  const composerBtn = document.getElementById('composerBtn');

  // Ouvert à tout le monde pour l'instant (la limitation spécifique aux comptes
  // "visiteur" viendra dans un second temps, une fois validée séparément).
  if(!currentUid){
    composerBtn.style.pointerEvents = 'none';
    composerBtn.style.opacity = '0.5';
    return;
  }
  wireComposerModal();
  composerBtn.onclick = function(){
    if(!editingPostId){
      const villeInput = document.getElementById('composerVille');
      if(villeInput && !villeInput.value) villeInput.value = (currentUserData && currentUserData.ville) || '';
    }
    window.__openComposer();
  };
}

auth.onAuthStateChanged(async function(user){
  currentUid = user ? user.uid : null;
  if(user){
    try{
      const uSnap = await getDoc(doc(db,'utilisateurs', user.uid));
      currentUserData = uSnap.exists ? uSnap.data() : {};
      monPaysPrefixe = extraireIndicatifTelephone(currentUserData.telephone);
    }catch(e){ currentUserData = {}; }
    const av = document.getElementById('myAvatar');
    av.innerHTML = currentUserData.photoAvatar
      ? ('<img src="'+currentUserData.photoAvatar+'">')
      : (currentUserData.prenom||'?')[0].toUpperCase();
  }
  await initComposer();
  try{ await ensureSeed(); }catch(e){ console.error('Seed Fil Presse impossible :', e); }
  try{ await ensureSeedImages(); }catch(e){ console.error('Seed illustré impossible :', e); }
  try{ await ensureSeedMore(); }catch(e){ console.error('Seed supplémentaire impossible :', e); }
  await markFollowedButtons();
  await loadFeed();
});
</script>
<script src="translations.js"></script>
</body>
