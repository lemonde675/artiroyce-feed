<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Offres – ArtiRoyce</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root { --red: #e63224; --green: #27a945; --blue: #1877f2; }
html, body { font-family: 'Segoe UI', Arial, sans-serif; background: #FFFFFF; color: #1c1e21; max-width: 480px; margin: 0 auto; overscroll-behavior-x: none; touch-action: pan-y; }

/* ── HEADER — copie exacte accueil.html ── */
.top-header {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 200;
  background: #fff; border-bottom: 1px solid #e8e8e8;
}
.h-row1 { display: flex; align-items: center; padding: 6px 12px 4px; gap: 6px; }
.h-house { font-size: 24px; flex-shrink: 0; }
.h-logo { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.h-logo-text { font-size: 22px; font-weight: 900; line-height: 1; letter-spacing: -0.5px; }
.h-logo-text .arti  { color: var(--red); }
.h-logo-text .royce { color: var(--green); }
.h-icons { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.h-ico {
  position: relative; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
}
.h-ico.bell { background: #fff8e1; border: 2px solid #ffc107; }
.h-ico.chat { background: #e8f5e9; border: 2px solid var(--green); }
.h-ico .bdot {
  position: absolute; top: -3px; right: -3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #fff;
}
.h-ico.chat .bdot { background: var(--green); }
.h-dots { font-size: 22px; color: #333; cursor: pointer; padding: 2px 4px; font-weight: 700; }

/* ── SÉLECTEUR DE LANGUE — pilule standard ArtiRoyce ── */
#langSel{ position:relative; }
.lang-pill{
  display:flex; align-items:center; gap:3px; background:#f5f5f5; border:1.5px solid #ddd;
  border-radius:16px; padding:5px 8px; font-size:12px; cursor:pointer; white-space:nowrap;
}
.lang-dropdown{
  display:none; position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid #e4e6eb;
  border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.12); z-index:400; min-width:150px; max-height:280px;
  overflow-y:auto; padding:6px;
}
#langSel.open .lang-dropdown{ display:block; }
.lang-option{
  padding:8px 10px; font-size:13px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:8px;
}
.lang-option:hover{ background:#f5f5f5; }
.lang-option.active{ background:#eef1fb; font-weight:700; color:var(--blue); }
.h-tabs {
  display: flex; align-items: center; overflow-x: auto; scrollbar-width: none;
  padding: 0 10px 7px; gap: 6px;
}
.h-tabs::-webkit-scrollbar { display: none; }
.h-tab {
  white-space: nowrap; padding: 5px 14px; border-radius: 22px;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  color: #555; background: transparent; border: none;
  display: flex; align-items: center; gap: 5px;
}
.h-tab.active { background: var(--red); color: #fff; font-weight: 700; }

/* ── CONTENU ── */
.content { padding-top: 108px; padding-bottom: 28px; background: #FFFFFF; }

/* Hero */
.hero {
  position: sticky; top: 108px; z-index: 50;
  margin: 14px 12px 0;
  background: #FFFFFF; border-radius: 24px;
  border: 1px solid #E8ECF0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 16px 40px rgba(0,0,0,0.07);
  padding: 24px 22px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.hero-left h2 { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
.hero-left p  { font-size: 13px; color: #65676b; margin-bottom: 14px; }
.btn-pub {
  display: inline-flex; align-items: center; gap: 5px;
  background: #F05545; color: #fff; border: none; border-radius: 22px;
  padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
}

/* Panneau — OFFRE D'EMPLOI seulement */
.panneau-outer { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 72px; }
.ficelle { width: 50px; height: 16px; position: relative; }
.ficelle::before, .ficelle::after {
  content: ''; position: absolute; bottom: 0;
  width: 23px; height: 1.5px; background: #bbb;
}
.ficelle::before { left: 0; transform-origin: 100% 100%; transform: rotate(-20deg); }
.ficelle::after  { right: 0; transform-origin: 0 100%; transform: rotate(20deg); }
.ficelle .crochet {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 7px; height: 7px; border: 1.5px solid #aaa; border-radius: 50%;
}
.panneau-box {
  background: #fff; border: 1.5px solid #e4e6eb;
  border-radius: 8px; padding: 7px 8px; text-align: center;
  box-shadow: 2px 3px 8px rgba(0,0,0,.10); transform: rotate(-1.5deg);
}
.panneau-box .pt { font-size: 10px; font-weight: 900; color: #1c1e21; }
.panneau-box .ps { font-size: 10px; font-weight: 900; color: var(--red); }

/* Stats — simples, chiffres en noir */
.stats { display: flex; gap: 8px; margin: 8px 10px 0; }
.stat {
  flex: 1; background: #fff; border-radius: 12px;
  padding: 10px 6px 8px; text-align: center;
  border: 1px solid #e4e6eb;
}
.stat .sv { font-size: 20px; font-weight: 900; color: #1c1e21; }
.stat .sl { font-size: 11px; color: #65676b; margin-top: 1px; }

/* Filtres */
.filtres {
  display: flex; gap: 7px; overflow-x: auto; padding: 8px 10px 2px;
  scrollbar-width: none;
}
.filtres::-webkit-scrollbar { display: none; }
.filtre {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 600; border: 1px solid #e4e6eb;
  background: #fff; cursor: pointer; color: #444; white-space: nowrap;
}
.filtre.on { background: var(--red); color: #fff; border-color: var(--red); }

/* Label section */
.sec-label {
  font-size: 11.5px; font-weight: 700; color: #65676b;
  padding: 10px 12px 3px; text-transform: uppercase; letter-spacing: .3px;
}

/* ── CARD ── */
.card {
  background: #FFFFFF; border-radius: 20px;
  margin: 0 12px 12px 12px; overflow: hidden;
  border: 1px solid #E8ECF0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
}
.card-body { padding: 18px 18px 0; }

/* En-tête */
.card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.ava {
  width: 44px; height: 44px; border-radius: 14px;
  font-size: 21px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: #F2F4F7;
}
.card-info { flex: 1; }
.card-info h3 { font-size: 14px; font-weight: 700; line-height: 1.35; margin-bottom: 2px; color: #1c1e21; }
.card-info .meta { font-size: 11.5px; color: #65676b; }
.bdg-type {
  flex-shrink: 0; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; gap: 3px;
}
.bdg-type.demande { background: #ffeeed; color: var(--red); }
.bdg-type.offre   { background: #edfff2; color: var(--green); }

/* Image pleine largeur */
.card-hero-img {
  width: 100%; max-height: 320px; object-fit: contain;
  display: block; margin-bottom: 0; background: #f0f0f0;
}

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.tag { padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; color: #444; background: #f0f2f5; }
.tag.urgent { background: #fff3e0; color: #e65100; }
.tag.prix   { background: #e8f5e9; color: #1b5e20; }
.tag.lieu   { background: #e8f0ff; color: #1a237e; }
.tag.date   { background: #f3e5f5; color: #4a148c; }

/* Validité */
.valid-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-bottom: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.on  { background: var(--green); }
.dot.off { background: #bbb; }
.vs { font-weight: 700; }
.vs.active { color: var(--green); }
.vs.expire { color: #999; }
.vt { color: #65676b; margin-left: auto; font-size: 11px; }

.cand { font-size: 12px; color: #65676b; margin-bottom: 10px; }

/* Actions — style Facebook */
.card-actions {
  display: flex; gap: 0;
  border-top: 1px solid #e4e6eb;
  border-bottom: 1px solid #e4e6eb;
}
.btn-c, .btn-a {
  flex: 1; padding: 10px 4px; border: none; background: #fff;
  font-size: 13px; font-weight: 700; cursor: pointer; color: #65676b;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  border-right: 1px solid #e4e6eb;
}
.btn-c:last-child, .btn-a:last-child { border-right: none; }
.btn-a.rouge { color: var(--red); }
.btn-a.vert  { color: var(--green); }

/* Expirée */
.card.expiree { opacity: .6; }
.expired-banner {
  background: #f5f5f5; border-radius: 8px; padding: 7px 12px;
  font-size: 12px; color: #999; text-align: center; margin-bottom: 10px;
  border: 1px dashed #ddd;
}

/* ════════════════════════════════════
   COMMENTAIRES — style TikTok propre
════════════════════════════════════ */
.comm-section { padding: 12px 14px 14px; }

.comm-reactions {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: #65676b; margin-bottom: 8px;
  padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;
}
.like-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 20px; border: 1.5px solid #e4e6eb;
  background: #fff; font-size: 13px; cursor: pointer; font-weight: 600;
  color: #65676b; transition: all .15s; position: relative;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.like-btn.liked { background: #fff8f7; border-color: var(--red); color: var(--red); }
/* Panoplie réactions */
.reactions-panel {
  display: none; position: absolute; bottom: 40px; left: 0;
  background: #fff; border-radius: 40px; padding: 8px 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15); border: 1px solid #e4e6eb;
  z-index: 50; white-space: nowrap;
}
.reactions-panel.open { display: flex; gap: 8px; align-items: center; }
.reaction-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; padding: 4px 6px; border-radius: 12px; transition: background .15s;
}
.reaction-item:hover { background: #f0f2f5; }
.reaction-item .r-emoji { font-size: 28px; transition: transform .15s; }
.reaction-item:hover .r-emoji { transform: scale(1.25); }
.reaction-item .r-label { font-size: 10px; color: #65676b; font-weight: 600; }

/* Panoplie de réactions sur chaque commentaire — même principe, en plus compact */
.comm-reactions-panel {
  display: none; position: absolute; bottom: 24px; left: 40px;
  background: #fff; border-radius: 30px; padding: 6px 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15); border: 1px solid #e4e6eb;
  z-index: 60; white-space: nowrap;
}
.comm-reactions-panel.open { display: flex; gap: 4px; align-items: center; }
.comm-reaction-item { cursor: pointer; padding: 3px 4px; border-radius: 10px; transition: background .15s; }
.comm-reaction-item:hover { background: #f0f2f5; transform: scale(1.2); }
.comm-reaction-item .r-emoji { font-size: 20px; }
/* Modal postuler */
.postuler-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 400; align-items: flex-end; justify-content: center;
}
.postuler-overlay.open { display: flex; }
.postuler-sheet {
  background: #fff; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px; padding: 16px 16px 40px;
  animation: up .25s ease;
}
.postuler-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; text-align: center; }
.postuler-opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px; margin-bottom: 8px;
  border: 1.5px solid #e4e6eb; cursor: pointer; background: #fff;
  font-size: 14px; font-weight: 600; color: #1c1e21;
  transition: all .15s; width: 100%; text-align: left;
}
.postuler-opt:hover { background: #f9f9f9; border-color: var(--red); }
.postuler-opt .opt-icon { font-size: 22px; flex-shrink: 0; }
.postuler-cancel {
  width: 100%; padding: 13px; border-radius: 12px; border: none;
  background: #f0f2f5; font-size: 14px; font-weight: 700;
  color: #65676b; cursor: pointer; margin-top: 4px;
}

.comm-title {
  font-size: 13px; font-weight: 700; color: #1c1e21; margin-bottom: 10px;
}

/* Saisie */
.comm-input-row {
  display: flex; gap: 8px; align-items: center; margin-bottom: 14px;
}
.user-ava {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg,#1a5276,#2e86c1); color:#fff; font-size:13px; font-weight:800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
}
.user-ava img { width: 100%; height: 100%; object-fit: cover; }
.comm-input-box {
  flex: 1; background: #f0f2f5; border-radius: 22px;
  padding: 8px 14px; font-size: 13px; color: #65676b;
  cursor: text; border: none; outline: none;
  font-family: inherit;
}
.comm-input-icons { display: flex; gap: 8px; align-items: center; font-size: 18px; }

/* UN COMMENTAIRE — style TikTok */
.comm-item { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }

.comm-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: #e4e6eb; flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.comm-avatar img { width: 100%; height: 100%; object-fit: cover; }

.comm-right { flex: 1; min-width: 0; position: relative; }

/* Nom + badge Créateur */
.comm-name-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap;
}
.comm-name {
  font-size: 13px; font-weight: 700; color: #757575;
}
/* Badge Créateur — style TikTok : bleu inline */
.badge-createur {
  font-size: 11px; font-weight: 700; color: var(--blue);
  background: none; padding: 0;
}

/* Texte commentaire */
.comm-text {
  font-size: 14px; color: #1c1e21; line-height: 1.45; margin-bottom: 5px; word-break: break-word;
}
.voir-traduction {
  font-size: 12px; color: #8e8e8e; cursor: pointer; margin-bottom: 5px; display: inline-block;
}
.voir-traduction:hover { text-decoration: underline; }

/* Méta : date · Répondre (le cœur est sorti de cette ligne, façon TikTok) */
.comm-meta {
  display: flex; align-items: center; gap: 14px;
  font-size: 12px; color: #8e8e8e; position: relative;
}
.comm-meta .date { color: #8e8e8e; }
.comm-meta .rep  { font-weight: 700; color: #8e8e8e; cursor: pointer; }
.comm-meta-spacer { flex: 1; }

/* "J'aime" cliquable dans la ligne méta, comme TikTok/Facebook */
.rep-jaime { font-weight: 700; color: #8e8e8e; cursor: pointer; user-select: none; -webkit-touch-callout: none; -webkit-user-select: none; touch-action: manipulation; }
.rep-jaime.liked { color: var(--red); }

/* Compteur de réactions aligné à droite, sur la même ligne que Répondre */
.comm-meta-count {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; color: #8e8e8e; font-weight: 700; flex-shrink: 0;
}

/* Réponses imbriquées sous leur commentaire parent — façon Facebook */
.comm-replies-zone { margin-left: 30px; padding-left: 14px; border-left: 2px solid #eceef1; margin-bottom: 10px; }
.comm-replies-zone .comm-item { margin-bottom: 12px; }
.comm-replies-zone .comm-avatar { width: 28px; height: 28px; font-size: 11px; }
.voir-plus-reponses {
  font-size: 12px; font-weight: 700; color: #65676b; cursor: pointer; margin-bottom: 10px;
  padding: 4px 0;
}
.voir-plus-reponses:hover { color: #1c1e21; text-decoration: underline; }

/* Bandeau "réponse à …" au-dessus de la saisie */
.reply-indicator {
  display: none; align-items: center; justify-content: space-between;
  background: #f0f2f5; border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; font-size: 12px; color: #555;
}
.reply-indicator.active { display: flex; }
.reply-indicator .cancel-reply { cursor: pointer; font-weight: 800; color: #8e8e8e; padding: 0 4px; }

/* Ligne verticale réponses imbriquées */
.replies-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #8e8e8e; font-weight: 600;
  cursor: pointer; margin-top: 6px; margin-left: 0;
}
.replies-toggle::before {
  content: ''; display: inline-block;
  width: 20px; height: 1px; background: #c0c0c0;
}

/* Réponses imbriquées */
.replies-list { margin-top: 10px; padding-left: 0; }
.reply-item { display: flex; gap: 10px; margin-bottom: 12px; }
.reply-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: #e4e6eb; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #555;
}
.reply-right { flex: 1; }
.reply-name-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
}
.reply-name { font-size: 12px; font-weight: 700; color: #757575; }
.reply-text { font-size: 13px; color: #1c1e21; line-height: 1.4; margin-bottom: 4px; }
.reply-meta {
  display: flex; align-items: center; gap: 12px;
  font-size: 11px; color: #8e8e8e;
}
.reply-meta .likes { margin-left: auto; display: flex; align-items: center; gap: 3px; }


/* ── MODAL ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  padding: 0 16px env(safe-area-inset-bottom, 20px); animation: up .3s ease;
  padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
}
@keyframes up { from{transform:translateY(100%)} to{transform:translateY(0)} }
.m-handle { width: 36px; height: 4px; background: #ddd; border-radius: 4px; margin: 10px auto 14px; }
.modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: #65676b; margin-bottom: 14px; }

/* 4 modèles — simples */
.m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.m-card {
  border: 2px solid #e4e6eb; border-radius: 12px;
  padding: 14px 6px 10px; text-align: center; cursor: pointer;
  background: #fff; transition: border-color .15s;
}
.m-card.sel { border-color: var(--red); }
.m-icon { font-size: 26px; margin-bottom: 6px; }
.m-name { font-size: 12px; font-weight: 700; color: #1c1e21; }
.m-desc { font-size: 10px; color: #65676b; margin-top: 2px; }

/* Zone image carré */
.m2-preview {
  display: none; width: 100%; aspect-ratio: 1/1;
  border: 2px dashed #e4e6eb; border-radius: 10px;
  background: #f0f2f5; align-items: center; justify-content: center;
  flex-direction: column; color: #bbb; margin-bottom: 12px; cursor: pointer; font-size: 30px;
}
.m2-preview.show { display: flex; }
.m2-preview span { font-size: 12px; margin-top: 6px; color: #bbb; font-weight: 600; }

/* Formulaire */
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 12px; font-weight: 700; color: #65676b; margin-bottom: 4px; }
.fg input, .fg textarea, .fg select {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e4e6eb;
  border-radius: 10px; font-size: 14px; font-family: inherit;
  outline: none; background: #fff; color: #1c1e21; transition: border .2s;
}
.fg input:focus, .fg textarea:focus, .fg select:focus { border-color: var(--red); }
.fg textarea { resize: vertical; min-height: 70px; }
.row2 { display: flex; gap: 8px; }
.row2 .fg { flex: 1; }

.tog-row {
  display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700;
  color: #1c1e21; cursor: pointer; margin-bottom: 10px; padding: 10px 12px;
  border: 1px solid #e4e6eb; border-radius: 10px;
}
.tog {
  width: 38px; height: 21px; border-radius: 20px; background: #e4e6eb;
  position: relative; transition: background .2s; flex-shrink: 0;
}
.tog.on { background: var(--green); }
.tog::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 15px; height: 15px; border
