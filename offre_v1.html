<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panneau Offres — test réel isolé</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --red: #e63224; --green: #27a945; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6f8; color: #1c1e21; max-width: 480px; margin: 0 auto; }
  .page { padding: 16px; padding-top: 124px; }
  .btn-pub { display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: #fff; border: none; border-radius: 22px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-top: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h3 { font-size: 15px; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #65676b; }
  .panel-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; align-items: flex-end; justify-content: center; }
  .panel-overlay.open { display: flex; }
  .panel { background: #fff; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .panel-header h2 { font-size: 16px; }
  .panel-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f0f2f5; font-size: 15px; cursor: pointer; }
  .panel label { display: block; font-size: 12.5px; font-weight: 700; margin: 12px 0 5px; }
  .panel input, .panel textarea { width: 100%; border: 1.5px solid #e4e6eb; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; }
  .panel textarea { resize: vertical; min-height: 80px; }
  .btn-envoyer { width: 100%; margin-top: 18px; background: var(--red); color: #fff; border: none; border-radius: 22px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; margin-right: 6px; }
  .badge.demande { background: #fdeceb; color: var(--red); }
  .badge.offre { background: #eef8ee; color: var(--green); }
  .badge.urgent { background: #fff4e0; color: #e68a00; }
  .card .meta { font-size: 12px; color: #999; margin-top: 8px; }
  .sec-label { font-size: 12.5px; font-weight: 800; color: #65676b; margin: 20px 0 6px; text-transform: uppercase; letter-spacing: .3px; }
  .filtres { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; }
  .filtres::-webkit-scrollbar { display: none; }
  .filtre-pill { white-space: nowrap; padding: 7px 15px; border-radius: 22px; font-size: 12.5px; font-weight: 700; border: none; cursor: pointer; flex-shrink: 0; background: #fff; color: #777; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .filtre-pill.active[data-f="tout"] { background: #222; color: #fff; }
  .filtre-pill.active[data-f="urgent"] { background: #e68a00; color: #fff; }
  .filtre-pill.active[data-f="offre"] { background: var(--green); color: #fff; }
  .filtre-pill.active[data-f="demande"] { background: var(--red); color: #fff; }
  .barre-fixe-offres { position: sticky; top: 108px; z-index: 50; background: #f5f6f8; padding-bottom: 8px; will-change: transform; transform: translateZ(0); }
  .zone-publier { background: #fff; padding: 12px 16px; border-radius: 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.08); margin-top: 2px; }
  .zone-publier .cp-av { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#7a1a12,var(--red)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .zone-publier .cp-input { flex: 1; background: #f5f6f8; border-radius: 20px; padding: 10px 15px; font-size: 13.5px; color: #888; cursor: pointer; border: none; text-align: left; font-family: inherit; transition: background .15s; }
  .zone-publier .cp-input:hover { background: #eef0f2; }
  .zone-publier .cp-search-btn { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #f5f6f8; border: 1px solid #ececec; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .zone-publier .cp-search-btn:hover { background: #eef0f2; }
  .zone-publier .btn-emploi { flex-shrink: 0; background: #fff; border: 1px solid #e4e6eb; border-radius: 12px; padding: 6px 10px; font-size: 10.5px; font-weight: 800; line-height: 1.25; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); color: #1c1e21; font-family: inherit; }
  .zone-publier .btn-emploi span { display: block; color: var(--red); }
  .search-bar { display: none; align-items: center; gap: 8px; padding: 10px 14px; background: #fff; border-radius: 16px; margin-top: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .search-bar.open { display: flex; }
  .search-bar input { flex: 1; border: 1px solid #e8ecf0; border-radius: 20px; padding: 9px 14px; font-size: 13px; background: #f2f4f7; color: #222; font-family: inherit; }
  .search-bar .search-close { flex-shrink: 0; font-size: 13px; font-weight: 700; color: #888; cursor: pointer; padding: 4px; }
</style>
</head>
<body>

<div class="page">
  <div class="barre-fixe-offres">
    <div class="filtres" id="filtres">
      <span class="filtre-pill active" data-f="tout" onclick="choisirFiltre(this)">Tout</span>
      <span class="filtre-pill" data-f="urgent" onclick="choisirFiltre(this)">⚡ Urgent</span>
      <span class="filtre-pill" data-f="offre" onclick="choisirFiltre(this)">🟢 Offres</span>
      <span class="filtre-pill" data-f="demande" onclick="choisirFiltre(this)">🔴 Demandes</span>
    </div>

    <div class="zone-publier">
      <div class="cp-av">A</div>
      <button class="cp-input" onclick="ouvrirPanneau('demande')">Publier une offre ou une demande…</button>
      <button class="btn-emploi" onclick="ouvrirPanneau('offre')">OFFRE<span>D'EMPLOI</span></button>
      <button class="cp-search-btn" onclick="toggleSearch()" title="Rechercher">🔍</button>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Rechercher une offre, une ville, un budget…" oninput="onSearchInput()">
      <span class="search-close" onclick="toggleSearch()">Fermer</span>
    </div>
  </div>
  <div id="zoneDemande">
    <div class="sec-label">Offres et demandes</div>
    <div id="feedOffres"><div class="card"><p>⏳ Chargement…</p></div></div>
    <div id="sentinelle" style="height:1px"></div>
  </div>
</div>

<!-- Panneau -->
<div class="panel-overlay" id="panelDemande" onclick="if(event.target===this) this.classList.remove('open')">
  <div class="panel">
    <div class="panel-header">
      <h2>Publier une demande</h2>
      <button class="panel-close" onclick="document.getElementById('panelDemande').classList.remove('open')">✕</button>
    </div>
    <label>Titre</label>
    <input type="text" id="champTitre" placeholder="Ex : Recherche 5 peintres qualifiés">
    <label>Description</label>
    <textarea id="champDesc" placeholder="Décrivez votre demande…"></textarea>
    <label>Ville</label>
    <input type="text" id="champVille" placeholder="Cotonou">
    <label>Budget</label>
    <input type="text" id="champBudget" placeholder="50 000 FCFA/j">
    <button class="btn-envoyer" id="btnEnvoyer" onclick="publierDemande()">Publier</button>
  </div>
</div>

<div id="panneauDiagnostic" style="position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow-y:auto;background:#0b1b0f;color:#7CFC98;font:11px/1.5 monospace;padding:8px 10px;z-index:9999;white-space:pre-wrap;"></div>

<script>
function log(t){
  const p = document.getElementById('panneauDiagnostic');
  const l = document.createElement('div');
  l.textContent = new Date().toLocaleTimeString() + ' — ' + t;
  p.appendChild(l);
  p.scrollTop = p.scrollHeight;
}
log('1. Script démarré ✅');
window.addEventListener('error', e => log('❌ Erreur JS : ' + e.message + ' (' + (e.filename||'').split('/').pop() + ':' + e.lineno + ')'));
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" onload="log('2. app chargée ✅')" onerror="log('❌ échec app')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" onload="log('3. auth chargée ✅')" onerror="log('❌ échec auth')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" onload="log('4. firestore chargée ✅')" onerror="log('❌ échec firestore')"></script>

<script>
log('5. Dernier bloc atteint ✅');
const firebaseConfig = {
  apiKey: "AIzaSyBS_6CJN7Fu50pMu98sjuRxQetUcLu9l9w",
  authDomain: "artiroyce-f42e4.firebaseapp.com",
  projectId: "artiroyce-f42e4",
  storageBucket: "artiroyce-f42e4.firebasestorage.app",
  messagingSenderId: "588140774605",
  appId: "1:588140774605:web:b69cf8740c2fe5f1d59584"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.settings({ experimentalForceLongPolling: true });
log('6. Firebase initialisé ✅');

let currentUser = null;

auth.onAuthStateChanged(user => {
  log('7. Connexion : ' + (user ? user.uid : 'AUCUN'));
  if (!user) { log('❌ Pas connecté — impossible de charger le profil'); return; }
  currentUser = user;
  chargerOffres();
});

const TAILLE_LOT = 6;
let nombreAffiches = TAILLE_LOT;
let toutesLesOffres = [];
let observateur = null;
let filtreActif = 'tout';
let termeRecherche = '';
let typePublicationActuelle = 'demande';

function ouvrirPanneau(type){
  typePublicationActuelle = type;
  document.getElementById('panelDemande').classList.add('open');
}

function toggleSearch(){
  const barre = document.getElementById('searchBar');
  const ouvert = barre.classList.toggle('open');
  if (ouvert) {
    setTimeout(() => document.getElementById('searchInput').focus(), 150);
  } else {
    document.getElementById('searchInput').value = '';
    termeRecherche = '';
    nombreAffiches = TAILLE_LOT;
    afficherOffres();
  }
}
function onSearchInput(){
  termeRecherche = document.getElementById('searchInput').value.trim().toLowerCase();
  nombreAffiches = TAILLE_LOT;
  afficherOffres();
}

function choisirFiltre(el){
  document.querySelectorAll('.filtre-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filtreActif = el.dataset.f;
  nombreAffiches = TAILLE_LOT;
  afficherOffres();
}

function chargerOffres(){
  log('8. Chargement des offres depuis Firestore…');
  db.collection('offres').orderBy('createdAt','desc').limit(30).onSnapshot(snap => {
    toutesLesOffres = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    log('9. Offres reçues ✅ (' + toutesLesOffres.length + ')');
    nombreAffiches = TAILLE_LOT;
    afficherOffres();
  }, err => {
    log('❌ Erreur Firestore : ' + err.message);
  });
}

function afficherOffres(){
  const zone = document.getElementById('feedOffres');
  zone.innerHTML = '';
  let liste = toutesLesOffres;
  if (filtreActif === 'urgent') liste = liste.filter(o => o.urgent);
  else if (filtreActif === 'offre') liste = liste.filter(o => o.type === 'offre');
  else if (filtreActif === 'demande') liste = liste.filter(o => o.type === 'demande');
  if (termeRecherche) {
    liste = liste.filter(o => {
      const hay = ((o.titre||'') + ' ' + (o.description||'') + ' ' + (o.ville||'') + ' ' + (o.budget||'')).toLowerCase();
      return hay.includes(termeRecherche);
    });
  }
  if (!liste.length) {
    zone.innerHTML = '<div class="card"><p>Aucune offre pour ce filtre.</p></div>';
    return;
  }
  const visibles = liste.slice(0, nombreAffiches);
  visibles.forEach(o => {
    const div = document.createElement('div');
    div.className = 'card';
    const badgeType = o.type === 'demande' ? '<span class="badge demande">🔴 Demande</span>' : '<span class="badge offre">🟢 Offre</span>';
    const badgeUrgent = o.urgent ? '<span class="badge urgent">⚡ Urgent</span>' : '';
    div.innerHTML = '<div>' + badgeType + badgeUrgent + '</div>'
      + '<h3>' + (o.titre||'(sans titre)').replace(/</g,'&lt;') + '</h3>'
      + '<p class="meta">' + (o.ville||'') + (o.budget ? ' · '+o.budget : '') + '</p>';
    zone.appendChild(div);
  });
  log('10. Rendu terminé ✅ (' + visibles.length + '/' + liste.length + ' affichées)');
  if (observateur) observateur.disconnect();
  if (nombreAffiches < liste.length) {
    observateur = new IntersectionObserver(entrees => {
      if (entrees[0].isIntersecting) {
        nombreAffiches += TAILLE_LOT;
        afficherOffres();
      }
    }, { rootMargin: '400px' });
    observateur.observe(document.getElementById('sentinelle'));
  }
}

function publierDemande(){
  if (!currentUser) { log('❌ Publication refusée : non connecté'); return; }
  const titre = document.getElementById('champTitre').value.trim();
  if (!titre) { alert('Le titre est obligatoire.'); return; }
  const btn = document.getElementById('btnEnvoyer');
  btn.disabled = true; btn.textContent = 'Publication…';
  db.collection('offres').add({
    type: typePublicationActuelle,
    titre: titre,
    description: document.getElementById('champDesc').value.trim(),
    ville: document.getElementById('champVille').value.trim(),
    budget: document.getElementById('champBudget').value.trim(),
    auteurUid: currentUser.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    dureeDays: 30
  }).then(() => {
    log('10. Demande publiée ✅');
    document.getElementById('panelDemande').classList.remove('open');
    btn.disabled = false; btn.textContent = 'Publier';
    chargerOffres();
  }).catch(err => {
    log('❌ Erreur publication : ' + err.message);
    btn.disabled = false; btn.textContent = 'Publier';
  });
}
</script>
</body>
</html>
