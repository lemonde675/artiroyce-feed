}

/* ── Mélange aléatoire stable (ne rebrasse pas à chaque rafraîchissement) ── */
const _ordreAleatoireStableOffre = {};
function ordreAleatoireStableOffre(id) {
  if (!(id in _ordreAleatoireStableOffre)) _ordreAleatoireStableOffre[id] = Math.random();
  return _ordreAleatoireStableOffre[id];
}
function melangerAleatoirementOffre(liste) {
  return liste.slice().sort((a, b) => ordreAleatoireStableOffre(a.id) - ordreAleatoireStableOffre(b.id));
}

/* Classement par paliers, identique au principe d'Actualités :
   1. Mes propres offres
   2. Les personnes que je suis
   3. Même pays (indicatif téléphonique, approximatif)
   4. Le reste, mélangé aléatoirement de façon stable */
function trierOffresParPriorite(liste) {
  try {
    if (!currentUser || !Array.isArray(liste) || liste.length < 2) return liste;
    const mesOffres = [], suivis = [], memePays = [], reste = [];
    liste.forEach(o => {
      if (o.auteurUid === currentUser.uid) mesOffres.push(o);
      else if (o.auteurUid && followedUidsOffre.has(o.auteurUid)) suivis.push(o);
      else if (currentUser.paysPrefixe && o.paysPrefixe && o.paysPrefixe === currentUser.paysPrefixe) memePays.push(o);
      else reste.push(o);
    });
    return mesOffres.concat(suivis, memePays, melangerAleatoirementOffre(reste));
  } catch (e) {
    console.error('Tri par priorité offres :', e);
    return liste;
  }
}

let _coverPausedUntil = 0;
let _coverIntervalStarted = false;
function wireCoverCarousel(){
  if (_coverIntervalStarted) return;
  _coverIntervalStarted = true;
  setInterval(() => {
    if (Date.now() < _coverPausedUntil) return;
    document.querySelectorAll('.cover-carousel').forEach(track => {
      const maxScroll = track.scrollWidth - track.clientWidth;
      if (maxScroll <= 2) return;
      if (track.scrollLeft >= maxScroll - 2) track.scrollTo({ left: 0, behavior: 'smooth' });
      else track.scrollTo({ left: track.scrollLeft + 160, behavior: 'smooth' });
    });
  }, 3000);
  document.addEventListener('touchstart', e => { if (e.target.closest('.cover-carousel')) _coverPausedUntil = Date.now() + 4000; }, { passive: true });
  document.addEventListener('mousedown', e => { if (e.target.closest('.cover-carousel')) _coverPausedUntil = Date.now() + 4000; });
}

/* ── Glissement gauche/droite : relaie le geste au parent (accueil.html) via
   postMessage, exactement comme son propre mécanisme de glissement natif l'attend
   (swipeMove/swipeEnd avec un dx en pixels). Le parent gère lui-même l'animation de
   glissement du panneau — on ne navigue plus jamais directement l'iframe. ── */
(function(){
  let touchStartX = 0, touchStartY = 0, dragging = false, locked = null;
  const LOCK_PX = 5;

  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) return;
    if (e.target.closest('.cover-carousel, input, textarea')) { dragging = false; locked = 'ignore'; return; }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    dragging = false;
    locked = null;
  }, { passive: true });

  document.addEventListener('touchmove', function(e){
    if (locked === 'ignore' || !e.touches.length) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (locked === null && (Math.abs(dx) > LOCK_PX || Math.abs(dy) > LOCK_PX)) {
      locked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      if (locked === 'h') dragging = true;
    }
    if (dragging) {
      window.parent.postMessage({ type: 'swipeMove', dx: dx }, '*');
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e){
    const wasDragging = dragging;
    dragging = false;
    const wasIgnored = (locked === 'ignore');
    locked = null;
    if (wasIgnored || !wasDragging || !e.changedTouches || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    window.parent.postMessage({ type: 'swipeEnd', dx: dx }, '*');
  }, { passive: true });
})();

function chargerOffres() {
  const feedEl = document.getElementById('feedOffres');
  if (!feedEl) return;

  // Empêcher l'empilement d'écouteurs Firebase : fermer le précédent avant d'en ouvrir un nouveau
  // (chargerOffres() est appelée à plusieurs endroits — connexion, publication, changement de langue —
  // et sans cette fermeture, chaque appel ajoutait un écouteur supplémentaire, faisant tourner
  // le comptage des "J'aime" en boucle à chaque changement.)
  if (_unsubscribeOffres) { _unsubscribeOffres(); _unsubscribeOffres = null; }

  let q = db.collection('offres').orderBy('createdAt', 'desc');
  _unsubscribeOffres = q.onSnapshot(snap => {
    ajouterEtapeOffre('10. Snapshot reçu ✅ (' + snap.size + ' document(s))');
    dernierSnapshotOffres = snap;
    nombreAffichesOffre = TAILLE_LOT_OFFRE;
    rendreOffresDepuisSnapshot();
  }, err => {
    ajouterEtapeOffre('❌ Erreur Firestore (onSnapshot) : ' + (err && err.message || err));
    console.error('Erreur de chargement des offres :', err);
    const loading = document.getElementById('feed-loading');
    if (loading) {
      loading.innerHTML = '<div style="font-size:13px;color:#e63224;">⚠️ Erreur de chargement. Vérifiez votre connexion et rechargez la page.</div>';
    } else if (feedEl) {
      feedEl.innerHTML = '<div style="text-align:center;padding:40px 20px;font-size:13px;color:#e63224;">⚠️ Erreur de chargement. Vérifiez votre connexion et rechargez la page.</div>';
    }
  });
}

// Rendu à partir du dernier snapshot reçu — séparé de chargerOffres() pour pouvoir
// révéler un lot de plus (scroll) sans re-télécharger la collection à chaque fois.
function rendreOffresDepuisSnapshot() {
  const feedEl = document.getElementById('feedOffres');
  const snap = dernierSnapshotOffres;
  if (!feedEl || !snap) return;
  try {
    feedEl.innerHTML = '';
    const now = Date.now();
    let actives = [], expirees = [];
    const loading = document.getElementById('feed-loading');
    if (loading) loading.remove();

    snap.forEach(d => {
      const o = { id: d.id, ...d.data() };
      const expireMs = o.createdAt?.toMillis
        ? o.createdAt.toMillis() + (o.dureeDays||30)*24*3600*1000
        : now + 1;
      if (expireMs > now) actives.push(o);
      else expirees.push(o);
    });

    // Mettre à jour stats réelles
    const totalDemandes = actives.filter(o => o.type === 'demande').length;
    const totalOffres   = actives.filter(o => o.type === 'offre' || o.type === 'texte').length;
    const totalUrgentes = actives.filter(o => o.urgent).length;
    const elD = document.getElementById('stat-demandes');
    const elO = document.getElementById('stat-offres');
    const elU = document.getElementById('stat-urgentes');
    if (elD) elD.textContent = totalDemandes;
    if (elO) elO.textContent = totalOffres;
    if (elU) elU.textContent = totalUrgentes;

    // Filtrer
    const matchesSearch = o => {
      if (!searchTerm) return true;
      const hay = ((o.titre||'') + ' ' + (o.description||'') + ' ' + (o.ville||'') + ' ' + (o.categorie||'') + ' ' + (o.auteurNom||'')).toLowerCase();
      return hay.indexOf(searchTerm) !== -1;
    };
    const filtrer = arr => {
      let r = arr;
      if (filtreActif === 'urgent') r = r.filter(o => o.urgent);
      else if (filtreActif === 'offres') r = r.filter(o => o.type === 'offre' || o.type === 'texte');
      else if (filtreActif === 'demandes') r = r.filter(o => o.type === 'demande');
      return r.filter(matchesSearch);
    };

    // Afficher actives : mes offres d'abord, puis celles de la communauté (classées par palier)
    const activesTriees = trierOffresParPriorite(filtrer(actives));
    const mesOffresActives = activesTriees.filter(o => currentUser && o.auteurUid === currentUser.uid);
    const autresOffresActivesTotal = activesTriees.filter(o => !(currentUser && o.auteurUid === currentUser.uid));
    // Affichage progressif : seulement un lot à la fois, comme Actualités
    const autresOffresActives = autresOffresActivesTotal.slice(0, nombreAffichesOffre);

    if (mesOffresActives.length > 0) {
      const lblMoi = document.createElement('div');
      lblMoi.className = 'sec-label';
      lblMoi.textContent = 'Mes offres';
      feedEl.appendChild(lblMoi);
      mesOffresActives.forEach(o => feedEl.appendChild(buildCard(o, false)));
    }

    if (autresOffresActives.length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'sec-label';
      lbl.textContent = '🌍 Offres de la communauté';
      feedEl.appendChild(lbl);

      const carouselNode = buildCoverCarouselOffres(actives);
      const total = autresOffresActives.length;
      const useEveryFive = total >= 5;
      const midPoint = Math.max(1, Math.floor(total / 2));
      autresOffresActives.forEach((o, i) => {
        feedEl.appendChild(buildCard(o, false));
        if (carouselNode) {
          if (useEveryFive) { if ((i+1) % 5 === 0) feedEl.appendChild(carouselNode.cloneNode(true)); }
          else if ((i+1) === midPoint) { feedEl.appendChild(carouselNode); }
        }
      });
      if (carouselNode) wireCoverCarousel();
      markAuthorsOnlineOffre();

      // Sentinelle : dès qu'elle approche de l'écran, on révèle un lot de plus
      if (nombreAffichesOffre < autresOffresActivesTotal.length) {
        const sentinelle = document.createElement('div');
        sentinelle.id = 'offresSentinelle';
        sentinelle.style.cssText = 'height:1px;';
        feedEl.appendChild(sentinelle);
      }
    }

    // Afficher expirées
    if (filtrer(expirees).length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'sec-label';
      lbl.textContent = 'Offres expirées';
      feedEl.appendChild(lbl);
      filtrer(expirees).forEach(o => feedEl.appendChild(buildCard(o, true)));
    }

    if (filtrer(actives).length === 0 && filtrer(expirees).length === 0) {
      // Afficher offres exemples si vide
      const lbl = document.createElement('div');
      lbl.className = 'sec-label';
      lbl.textContent = 'Exemples';
      feedEl.appendChild(lbl);
      const exemples = [
        { id:'ex1', type:'demande', titre:'Recherche 10 maçons qualifiés', auteurNom:'Kofi Adjovi', ville:'Cotonou', categorie:'🧱 Maçonnerie', budget:'50 000 FCFA/j', urgent:true, dispo:'Dès lundi', candidatures:23, likes:12, dureeDays:14, categEmoji:'🧱', createdAt:{toMillis:()=>Date.now()-7200000} },
        { id:'ex2', type:'offre', titre:'Couturière disponible — robes & costumes', auteurNom:'Fatoumata Bah', ville:'Porto-Novo', categorie:'✂️ Couture', budget:'Négociable', urgent:false, dureeDays:21, categEmoji:'✂️', likes:18, candidatures:8, createdAt:{toMillis:()=>Date.now()-18000000} },
        { id:'ex3', type:'offre', titre:'DJ disponible pour événements & soirées', auteurNom:'David Koffi', ville:'Cotonou', categorie:'🎧 DJ', budget:'150 000 FCFA/soirée', urgent:true, dureeDays:28, categEmoji:'🎧', likes:28, candidatures:32, createdAt:{toMillis:()=>Date.now()-10800000} }
      ];
      exemples.forEach(o => feedEl.appendChild(buildCard(o, false)));
      const note = document.createElement('div');
      note.style.cssText='text-align:center;padding:16px;font-size:12px;color:#aaa;';
      note.textContent = 'Publiez la première vraie offre !';
      feedEl.appendChild(note);
    }
    observerSentinelleOffres();
    ajouterEtapeOffre('11. Rendu terminé ✅ (' + autresOffresActives.length + '/' + autresOffresActivesTotal.length + ' offres communauté affichées, ' + expirees.length + ' expirée(s))');
  } catch (eRendu) {
    ajouterEtapeOffre('❌ Erreur pendant le rendu : ' + (eRendu && eRendu.message || eRendu) + (eRendu && eRendu.stack ? ('\n' + eRendu.stack) : ''));
  }
}

// Observe la sentinelle en bas du fil : dès qu'elle approche de l'écran, on
// révèle un lot supplémentaire d'offres (comme Actualités).
let _observateurOffres = null;
function observerSentinelleOffres() {
  const sentinelle = document.getElementById('offresSentinelle');
  if (_observateurOffres) _observateurOffres.disconnect();
  if (!sentinelle) return;
  _observateurOffres = new IntersectionObserver((entrees) => {
    if (entrees[0].isIntersecting) {
      nombreAffichesOffre += TAILLE_LOT_OFFRE;
      rendreOffresDepuisSnapshot();
    }
  }, { rootMargin: '400px' });
  _observateurOffres.observe(sentinelle);
}
</script>
