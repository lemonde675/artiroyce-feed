<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test minimal Firebase</title>
</head>
<body style="font-family:sans-serif;padding:20px;">
<h2>Test minimal</h2>
<div id="panneauDiagnostic" style="position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow-y:auto;background:#0b1b0f;color:#7CFC98;font:12px/1.6 monospace;padding:8px 10px;z-index:9999;white-space:pre-wrap;"></div>

<script>
function ajouterEtapeOffre(texte){
  const panneau = document.getElementById('panneauDiagnostic');
  if (!panneau) return;
  const ligne = document.createElement('div');
  ligne.textContent = new Date().toLocaleTimeString() + ' — ' + texte;
  panneau.appendChild(ligne);
  panneau.scrollTop = panneau.scrollHeight;
}
ajouterEtapeOffre('1. Script démarré ✅');
window.addEventListener('error', function(e){
  ajouterEtapeOffre('❌ Erreur JS : ' + e.message + ' (' + (e.filename ? e.filename.split('/').pop() : '?') + ':' + (e.lineno||'?') + ')');
});
window.addEventListener('unhandledrejection', function(e){
  const m = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  ajouterEtapeOffre('❌ Erreur async non gérée : ' + m);
});
function signalerEchecFirebaseOffre(nomBibliotheque){
  ajouterEtapeOffre('❌ ÉCHEC du chargement Firebase (' + nomBibliotheque + ')');
}
ajouterEtapeOffre('2. Téléchargement des bibliothèques Firebase (compat)...');
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"
        onload="ajouterEtapeOffre('2b. Bibliothèque app chargée ✅')"
        onerror="signalerEchecFirebaseOffre('app')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"
        onload="ajouterEtapeOffre('2c. Bibliothèque auth chargée ✅')"
        onerror="signalerEchecFirebaseOffre('auth')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"
        onload="ajouterEtapeOffre('2d. Bibliothèque firestore chargée ✅')"
        onerror="signalerEchecFirebaseOffre('firestore')"></script>

<script>
ajouterEtapeOffre('2f. Dernier bloc de script atteint ✅');
const firebaseConfig = {
  apiKey: "AIzaSyBS_6CJN7Fu50pMu98sjuRxQetUcLu9l9w",
  authDomain: "artiroyce-f42e4.firebaseapp.com",
  projectId: "artiroyce-f42e4",
  storageBucket: "artiroyce-f42e4.firebasestorage.app",
  messagingSenderId: "588140774605",
  appId: "1:588140774605:web:b69cf8740c2fe5f1d59584"
};

let app, auth, db;
if (typeof firebase === 'undefined') {
  ajouterEtapeOffre('❌ Firebase (compat) indisponible, impossible de continuer');
} else {
  ajouterEtapeOffre('3. Toutes les bibliothèques Firebase chargées ✅');
  app  = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db   = firebase.firestore();
  ajouterEtapeOffre('4. Firebase initialisé ✅');

  auth.onAuthStateChanged(function(user){
    ajouterEtapeOffre('5. onAuthStateChanged déclenché, user = ' + (user ? user.uid : 'AUCUN'));
  });
}
</script>
</body>
</html>
