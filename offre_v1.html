<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panneau Offres — test réel isolé</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --red: #e63224; --green: #27a945; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6f8; color: #1c1e21; max-width: 480px; margin: 0 auto; }
  .page { padding: 16px; }
  .btn-pub { display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: #fff; border: none; border-radius: 22px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-top: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h3 { font-size: 15px; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #65676b; }
  .panel-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; align-items: flex-end; justify-content: center; }
  .panel-overlay.open { display: flex; }
  .panel { background: #fff; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .panel-header h2 { font-size: 16px; }
  .panel-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f0f2f5; font-size: 15px; cursor: pointer; }
  .panel label { display: block; font-size: 12.5px; font-weight: 700; margin: 12px 0 5px; }
  .panel input, .panel textarea { width: 100%; border: 1.5px solid #e4e6eb; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; }
  .panel textarea { resize: vertical; min-height: 80px; }
  .btn-envoyer { width: 100%; margin-top: 18px; background: var(--red); color: #fff; border: none; border-radius: 22px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-envoyer:disabled { opacity: .6; }
</style>
</head>
<body>

<div class="page">
  <button class="btn-pub" onclick="document.getElementById('panelDemande').classList.add('open')">＋ Publier une demande</button>
  <div id="zoneDemande">
    <div class="card"><p>⏳ Chargement d'une demande depuis la base…</p></div>
  </div>
</div>

<!-- Panneau -->
<div class="panel-overlay" id="panelDemande" onclick="if(event.target===this) this.classList.remove('open')">
  <div class="panel">
    <div class="panel-header">
      <h2>Publier une demande</h2>
      <button class="panel-close" onclick="document.getElementById('panelDemande').classList.remove('open')">✕</button>
    </div>
    <label>Titre</label>
    <input type="text" id="champTitre" placeholder="Ex : Recherche 5 peintres qualifiés">
    <label>Description</label>
    <textarea id="champDesc" placeholder="Décrivez votre demande…"></textarea>
    <label>Ville</label>
    <input type="text" id="champVille" placeholder="Cotonou">
    <label>Budget</label>
    <input type="text" id="champBudget" placeholder="50 000 FCFA/j">
    <button class="btn-envoyer" id="btnEnvoyer" onclick="publierDemande()">Publier</button>
  </div>
</div>

<div id="panneauDiagnostic" style="position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow-y:auto;background:#0b1b0f;color:#7CFC98;font:11px/1.5 monospace;padding:8px 10px;z-index:9999;white-space:pre-wrap;"></div>

<script>
function log(t){
  const p = document.getElementById('panneauDiagnostic');
  const l = document.createElement('div');
  l.textContent = new Date().toLocaleTimeString() + ' — ' + t;
  p.appendChild(l);
  p.scrollTop = p.scrollHeight;
}
log('1. Script démarré ✅');
window.addEventListener('error', e => log('❌ Erreur JS : ' + e.message + ' (' + (e.filename||'').split('/').pop() + ':' + e.lineno + ')'));
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" onload="log('2. app chargée ✅')" onerror="log('❌ échec app')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" onload="log('3. auth chargée ✅')" onerror="log('❌ échec auth')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" onload="log('4. firestore chargée ✅')" onerror="log('❌ échec firestore')"></script>

<script>
log('5. Dernier bloc atteint ✅');
const firebaseConfig = {
  apiKey: "AIzaSyBS_6CJN7Fu50pMu98sjuRxQetUcLu9l9w",
  authDomain: "artiroyce-f42e4.firebaseapp.com",
  projectId: "artiroyce-f42e4",
  storageBucket: "artiroyce-f42e4.firebasestorage.app",
  messagingSenderId: "588140774605",
  appId: "1:588140774605:web:b69cf8740c2fe5f1d59584"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.settings({ experimentalForceLongPolling: true });
log('6. Firebase initialisé ✅');

let currentUser = null;

auth.onAuthStateChanged(user => {
  log('7. Connexion : ' + (user ? user.uid : 'AUCUN'));
  if (!user) { log('❌ Pas connecté — impossible de charger le profil'); return; }
  currentUser = user;
  chargerUneDemande();
});

function chargerUneDemande(){
  log('8. Recherche d\'une demande dans Firestore…');
  db.collection('offres').where('type','==','demande').limit(1).get()
    .then(snap => {
      const zone = document.getElementById('zoneDemande');
      if (snap.empty) {
        log('8b. Aucune demande trouvée');
        zone.innerHTML = '<div class="card"><p>Aucune demande dans la base pour l\'instant.</p></div>';
        return;
      }
      const d = snap.docs[0].data();
      log('9. Demande reçue ✅ : ' + (d.titre || '(sans titre)'));
      zone.innerHTML = '<div class="card"><h3>' + (d.titre||'(sans titre)').replace(/</g,'&lt;') + '</h3>'
        + '<p>' + (d.ville||'') + (d.budget ? ' · '+d.budget : '') + '</p></div>';
    })
    .catch(err => log('❌ Erreur Firestore : ' + err.message));
}

function publierDemande(){
  if (!currentUser) { log('❌ Publication refusée : non connecté'); return; }
  const titre = document.getElementById('champTitre').value.trim();
  if (!titre) { alert('Le titre est obligatoire.'); return; }
  const btn = document.getElementById('btnEnvoyer');
  btn.disabled = true; btn.textContent = 'Publication…';
  db.collection('offres').add({
    type: 'demande',
    titre: titre,
    description: document.getElementById('champDesc').value.trim(),
    ville: document.getElementById('champVille').value.trim(),
    budget: document.getElementById('champBudget').value.trim(),
    auteurUid: currentUser.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    dureeDays: 30
  }).then(() => {
    log('10. Demande publiée ✅');
    document.getElementById('panelDemande').classList.remove('open');
    btn.disabled = false; btn.textContent = 'Publier';
    chargerUneDemande();
  }).catch(err => {
    log('❌ Erreur publication : ' + err.message);
    btn.disabled = false; btn.textContent = 'Publier';
  });
}
</script>
</body>
</html>
